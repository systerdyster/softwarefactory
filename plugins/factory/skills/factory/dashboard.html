<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Quest</title>
<style>
  :root {
    --bg: #2e2019; --ink: #5b2a12; --muted: #8a5a35; --line: #5b2a12; --page-ink: #fbe2b0;
    --paper: #fbe2b0; --paper-2: #f3cc8a; --wood: #b5652a; --wood-light: #e3a058; --wood-dark: #5b2a12;
    --you: #c4471f; --bad: #b02a2a; --good: #3f7a2c; --focus: #ffd75e;
    --font: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--page-ink); font: 13px/1.5 var(--font); }
  img.ptxt, canvas, img.face { image-rendering: pixelated; image-rendering: crisp-edges; }
  img.ptxt { display: block; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  header.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 14px 16px; }
  header.top h1 { margin: 0; }
  header.top .meta { color: #d9b98a; font-size: 12px; overflow-wrap: anywhere; flex: 1 1 260px; }
  header.top .warn { color: var(--focus); }
  .warn { color: var(--you); }
  main { padding: 0 16px 32px; display: grid; gap: 14px; }
  .stage { position: relative; border: 4px solid var(--wood); outline: 3px solid var(--wood-dark); border-radius: 6px;
           box-shadow: inset 0 0 0 2px var(--wood-light); overflow: hidden; background: #000; }
  #map { display: block; margin: 0 auto; touch-action: pan-y; cursor: grab; }
  #map.dragging { cursor: grabbing; }
  #map.pointing { cursor: pointer; }
  #tip { position: absolute; pointer-events: none; z-index: 2; max-width: 280px; }
  #tip[hidden] { display: none; }

  .win { color: var(--ink); border: 4px solid var(--wood); border-radius: 6px; outline: 3px solid var(--wood-dark);
         background: var(--paper); box-shadow: inset 0 0 0 2px var(--wood-light), inset 0 0 0 5px var(--paper-2);
         padding: 12px 14px; min-width: 0; }
  :root { --win-shade: #d9a868; }
  .board-area { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; align-items: start; }
  @media (max-width: 900px) { .board-area { grid-template-columns: minmax(0, 1fr); } }
  .windows { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
  @media (max-width: 1200px) { .windows { grid-template-columns: minmax(0, 1fr); } }
  .lane { display: grid; gap: 12px; align-content: start; min-width: 0; }
  .lane h2 { margin: 0; }
  .lane-empty { margin: 0; padding: 10px 12px; border: 2px dashed #6a4a32; border-radius: 6px; color: #b08a62; font-size: 12px; }
  .side { display: grid; gap: 12px; align-content: start; padding-top: 28px; }
  @media (max-width: 900px) { .side { padding-top: 0; } }
  .win h2 { margin: 0 0 8px; }
  .job { display: grid; gap: 4px; cursor: pointer; position: relative; padding-left: 16px; }
  .job + .job { margin-top: 10px; padding-top: 10px; border-top: 2px solid var(--win-shade); }
  .job:hover::before, .job:focus-within::before { content: "▶"; position: absolute; left: 0; color: var(--you); }
  .win.job { padding-left: 26px; }
  .win.job:hover::before, .win.job:focus-within::before { left: 8px; top: 10px; }
  .win.job.you { border-color: #e2a62a; box-shadow: inset 0 0 0 2px #ffd75e, inset 0 0 0 5px var(--paper-2); }
  .win.job.bad { border-color: #b02a2a; box-shadow: inset 0 0 0 2px #e9786a, inset 0 0 0 5px var(--paper-2); }
  .job-head { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .swatch { width: 12px; height: 12px; flex: none; border: 2px solid var(--wood-dark); }
  .job .title { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font-weight: 700;
                overflow-wrap: anywhere; min-width: 0; }
  .job .line { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .job .time { color: var(--muted); font-size: 12px; }
  .job .crew { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12px; color: var(--muted); }
  .job .crew .PASS { color: var(--good); } .job .crew .CHANGES { color: var(--bad); } .job .crew .running { color: var(--ink); }
  .job .reason { margin: 0; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .job.you .reason { color: var(--you); } .job.bad .reason { color: var(--bad); }
  .mood { display: flex; gap: 6px; align-items: center; font-size: 12px; }
  .crew-art { display: block; max-width: 100%; margin: 2px 0; }
  img.face { width: 36px; height: 36px; }
  .empty { color: var(--muted); margin: 0; }
  details.win summary { cursor: pointer; list-style: none; }
  details.win summary::-webkit-details-marker { display: none; }
  details.win[open] summary { margin-bottom: 8px; }

  dialog { width: min(880px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; color: var(--ink);
           border: 4px solid var(--wood); border-radius: 6px; outline: 3px solid var(--wood-dark);
           background: var(--paper); box-shadow: inset 0 0 0 2px var(--wood-light); }
  dialog::backdrop { background: rgb(0 0 0 / .6); }
  .dlg-head { display: flex; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 2px solid var(--win-shade); }
  .dlg-head h2 { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
  .dlg-body { display: grid; grid-template-columns: 190px 1fr; min-height: 300px; }
  @media (max-width: 640px) { .dlg-body { grid-template-columns: 1fr; } }
  .files { border-right: 2px solid var(--win-shade); padding: 8px; overflow: auto; max-height: 65vh; }
  .files button { display: block; width: 100%; text-align: left; border: 0; background: none; font-size: 12px;
                  padding: 4px 6px 4px 16px; cursor: pointer; overflow-wrap: anywhere; position: relative; }
  .files button[aria-current="true"]::before, .files button:hover::before { content: "▶"; position: absolute; left: 2px; color: var(--you); }
  .files button[aria-current="true"] { font-weight: 700; }
  .doc { padding: 12px 18px; overflow: auto; max-height: 65vh; min-width: 0; }
  .doc pre { background: var(--paper-2); padding: 10px; overflow: auto; }
  .doc code { font: 12px var(--font); }
  .doc table { border-collapse: collapse; } .doc td, .doc th { border: 1px solid var(--win-shade); padding: 3px 8px; }
  .story-wrap:empty { display: none; }
  .story { margin: 0; padding: 10px 16px 10px 34px; border-bottom: 2px solid var(--win-shade); font-size: 12px;
           color: var(--muted); display: grid; gap: 2px; }
  .story li { overflow-wrap: anywhere; }
  .acts { padding: 12px 16px; border-bottom: 2px solid var(--win-shade); max-height: 55vh; overflow: auto; }
  .acts:empty { display: none; }
  .acts h3 { margin: 0 0 6px; font-size: 14px; color: var(--you); }
  .acts .q { margin: 0 0 6px; font-weight: 700; overflow-wrap: anywhere; }
  .acts .ctx { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .acts .ctx p { margin: 0 0 6px; }
  .acts .lead { margin: 10px 0 4px; font-weight: 700; }
  .acts .least { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
  .acts .warn { color: var(--bad); }
  .opts { border: 0; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
  .opt { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 2px solid var(--win-shade);
         cursor: pointer; overflow-wrap: anywhere; }
  .opt:has(input:checked) { border-color: var(--you); }
  .opt input { margin-top: 3px; accent-color: var(--you); }
  .rec { font-size: 11px; padding: 0 6px; background: var(--good); color: var(--paper); }
  .acts textarea { display: block; width: 100%; min-height: 38px; margin-top: 8px; font: inherit; padding: 6px 8px;
                   border: 2px solid var(--wood); background: #fff3d6; color: inherit; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .btn { padding: 6px 12px; border: 3px solid var(--wood-dark); border-radius: 4px; background: var(--wood-light);
         box-shadow: inset 0 -3px 0 var(--wood); color: var(--wood-dark); font-weight: 700; cursor: pointer; }
  .btn:hover:not(:disabled) { background: #f0b46a; }
  .btn.primary { background: #7cc34a; box-shadow: inset 0 -3px 0 #4f8a2c; }
  .btn.primary:hover:not(:disabled) { background: #8ed45a; }
  .btn.danger { color: var(--bad); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .cmds { display: grid; gap: 4px; padding: 8px 16px; font-size: 12px; border-bottom: 2px solid var(--win-shade); }
  .cmds:empty { display: none; }
  .cmd { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; overflow-wrap: anywhere; }
  .cmd .state { font-size: 11px; font-weight: 700; padding: 0 6px; }
  .cmd .state.queued { background: var(--win-shade); }
  .cmd .state.applied { background: var(--good); color: var(--paper); }
  .cmd .state.refused { background: var(--bad); color: var(--paper); }
  .note { font-size: 12px; color: var(--muted); }
  .error { color: var(--bad); padding: 16px; }
</style>
</head>
<body>
<header class="top">
  <h1 id="title"></h1>
  <span class="meta" id="meta">Loading…</span>
</header>
<main>
  <div class="stage">
    <canvas id="map" role="img" aria-label="The factory as a medieval street; every job is listed below it"></canvas>
    <div id="tip" class="win" hidden></div>
  </div>
  <div class="board-area">
    <div class="windows" id="cards" aria-label="Jobs by state"></div>
    <aside class="side" id="side" aria-label="Queue and finished jobs"></aside>
  </div>
</main>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-head">
    <div><div class="note" id="dlg-id"></div><h2 id="dlg-title"></h2><div class="note" id="dlg-reason"></div></div>
    <button class="btn" id="dlg-close" aria-label="Close">Close</button>
  </div>
  <section class="story-wrap" id="dlg-story" aria-label="What has happened"></section>
  <section class="acts" id="dlg-acts"></section>
  <div class="cmds" id="dlg-cmds" role="status" aria-live="polite" aria-label="Commands for this job"></div>
  <div class="dlg-body">
    <nav class="files" id="dlg-files" aria-label="Job files"></nav>
    <article class="doc" id="dlg-doc"></article>
  </div>
</dialog>

<script>
// One warm palette for everything, and for each colour the darker one that shades it. Sprites are flat
// colour, shaded only along their right and bottom silhouette, with a dark brown outline ("black").
const Gfx = (() => {
  const C = {
    black: "#3a2125", navy: "#2f3d6b", plum: "#8a3a5b", green: "#3f8a3c", brown: "#b06a35", grey: "#7a6a5a",
    silver: "#d8cbb4", white: "#fff6e0", red: "#d9453b", orange: "#f2a23a", yellow: "#ffd75e", lime: "#8bd24a",
    blue: "#5aa9e6", lavender: "#9c8aa8", pink: "#f08aa0", peach: "#f7c79b", umber: "#4a2a1c", ink: "#262a40",
    wine: "#5a2a3f", teal: "#2e6a5a", rust: "#7d3f22", ash: "#5a4a40", tan: "#c4a27a", cream: "#f6e6a6",
    crimson: "#a8323a", amber: "#e07a2e", leaf: "#a6d655", jade: "#5cae45", cobalt: "#3a6fb5", mauve: "#7a5a78",
    salmon: "#e9786a", apricot: "#f0a77a",
  };
  const SHADE = {
    navy: "ink", plum: "wine", green: "teal", brown: "rust", grey: "ash", silver: "lavender", white: "silver",
    red: "crimson", orange: "amber", yellow: "orange", lime: "jade", blue: "cobalt", lavender: "mauve", pink: "mauve",
    peach: "apricot", umber: "black", ink: "black", wine: "umber", teal: "ink", rust: "umber", ash: "umber", tan: "grey",
    cream: "tan", crimson: "plum", amber: "rust", leaf: "jade", jade: "green", cobalt: "navy", mauve: "wine",
    salmon: "crimson", apricot: "salmon", black: "black",
  };
  const darker = (name) => SHADE[name] || name;

  function grid(w, h, ox = 0, oy = 0) {
    const a = new Array(w * h).fill(null);
    const g = {
      w, h,
      get: (x, y) => (x >= 0 && y >= 0 && x < w && y < h ? a[y * w + x] : null),
      set(x, y, m) { x = Math.round(x + ox); y = Math.round(y + oy); if (x >= 0 && y >= 0 && x < w && y < h) a[y * w + x] = m; return g; },
      rect(x, y, rw, rh, m) { for (let j = 0; j < rh; j++) for (let i = 0; i < rw; i++) g.set(x + i, y + j, m); return g; },
    };
    return g;
  }

  // Materials name a palette colour through `pal`; FLAT ones are never shaded.
  const FLAT = new Set(["pupil", "mouth", "blush", "gem", "line", "lens", "sweat", "white", "gold", "red", "metalL"]);
  function paint(ctx, g, pal, ox = 0, oy = 0, mirror = false) {
    const side = mirror ? -1 : 1;
    for (let y = 0; y < g.h; y++) {
      for (let x = 0; x < g.w; x++) {
        const m = g.get(x, y);
        let c;
        if (!m) {
          if (!(g.get(x, y + 1) || g.get(x, y - 1) || g.get(x - 1, y) || g.get(x + 1, y))) continue;
          c = C.black;
        } else {
          const name = pal[m] || "red";
          const rim = !FLAT.has(m) && (!g.get(x + side, y) || !g.get(x, y + 1));
          c = C[rim ? darker(name) : name] || name;
        }
        ctx.fillStyle = c;
        ctx.fillRect(ox + (mirror ? g.w - 1 - x : x), oy + y, 1, 1);
      }
    }
  }

  function canvas(w, h) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    return c;
  }

  function rnd(seed) {
    return () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  return { C, darker, grid, paint, canvas, rnd };
})();

// 5×7 capitals for headings as <img>; the alt carries the text.
const Font = (() => {
  const GLYPHS = {
    A: "01110 10001 10001 11111 10001 10001 10001", B: "11110 10001 10001 11110 10001 10001 11110",
    C: "01110 10001 10000 10000 10000 10001 01110", D: "11110 10001 10001 10001 10001 10001 11110",
    E: "11111 10000 10000 11110 10000 10000 11111", F: "11111 10000 10000 11110 10000 10000 10000",
    G: "01110 10001 10000 10111 10001 10001 01111", H: "10001 10001 10001 11111 10001 10001 10001",
    I: "01110 00100 00100 00100 00100 00100 01110", J: "00111 00010 00010 00010 00010 10010 01100",
    K: "10001 10010 10100 11000 10100 10010 10001", L: "10000 10000 10000 10000 10000 10000 11111",
    M: "10001 11011 10101 10101 10001 10001 10001", N: "10001 10001 11001 10101 10011 10001 10001",
    O: "01110 10001 10001 10001 10001 10001 01110", P: "11110 10001 10001 11110 10000 10000 10000",
    Q: "01110 10001 10001 10001 10101 10010 01101", R: "11110 10001 10001 11110 10100 10010 10001",
    S: "01111 10000 10000 01110 00001 00001 11110", T: "11111 00100 00100 00100 00100 00100 00100",
    U: "10001 10001 10001 10001 10001 10001 01110", V: "10001 10001 10001 10001 10001 01010 00100",
    W: "10001 10001 10001 10101 10101 10101 01010", X: "10001 10001 01010 00100 01010 10001 10001",
    Y: "10001 10001 01010 00100 00100 00100 00100", Z: "11111 00001 00010 00100 01000 10000 11111",
    0: "01110 10001 10011 10101 11001 10001 01110", 1: "00100 01100 00100 00100 00100 00100 01110",
    2: "01110 10001 00001 00010 00100 01000 11111", 3: "11111 00010 00100 00010 00001 10001 01110",
    4: "00010 00110 01010 10010 11111 00010 00010", 5: "11111 10000 11110 00001 00001 10001 01110",
    6: "00110 01000 10000 11110 10001 10001 01110", 7: "11111 00001 00010 00100 01000 01000 01000",
    8: "01110 10001 10001 01110 10001 10001 01110", 9: "01110 10001 10001 01111 00001 00010 01100",
    ".": "00000 00000 00000 00000 00000 01100 01100", ",": "00000 00000 00000 00000 01100 00100 01000",
    ":": "00000 01100 01100 00000 01100 01100 00000", "-": "00000 00000 00000 11111 00000 00000 00000",
    "!": "00100 00100 00100 00100 00100 00000 00100", "?": "01110 10001 00001 00010 00100 00000 00100",
    "/": "00001 00010 00010 00100 01000 01000 10000", "#": "01010 01010 11111 01010 11111 01010 01010",
    "(": "00010 00100 01000 01000 01000 00100 00010", ")": "01000 00100 00010 00010 00010 00100 01000",
    "'": "00100 00100 01000 00000 00000 00000 00000", "+": "00000 00100 00100 11111 00100 00100 00000",
    "·": "00000 00000 00000 01100 01100 00000 00000",
  };
  const images = new Map();

  function text(str, colour = "#5b2a12", scale = 2, shadow = "#f3cc8a") {
    const s = String(str).toUpperCase();
    const key = `${s}|${colour}|${scale}|${shadow}`;
    if (!images.has(key)) {
      const chars = [...s];
      const c = Gfx.canvas(chars.reduce((w, ch) => w + (ch === " " ? 4 : 6), 0) + 1, 8);
      const ctx = c.getContext("2d");
      let x = 0;
      for (const ch of chars) {
        if (ch === " ") { x += 4; continue; }
        const rows = (GLYPHS[ch] || GLYPHS["?"]).split(" ");
        for (const [fill, d] of [[shadow, 1], [colour, 0]]) {
          ctx.fillStyle = fill;
          rows.forEach((row, j) => [...row].forEach((bit, i) => { if (bit === "1") ctx.fillRect(x + i + d, j + d, 1, 1); }));
        }
        x += 6;
      }
      images.set(key, { url: c.toDataURL(), w: c.width, h: c.height });
    }
    const t = images.get(key);
    return `<img class="ptxt" src="${t.url}" width="${t.w * scale}" height="${t.h * scale}" alt="${s.replace(/"/g, "&quot;")}">`;
  }

  return { text };
})();

// The cast: small figures in half profile, facing right (left is mirrored), each with the tool of
// its trade. A sprite is 26×26; the body's own coordinates start at (7, 6) so hats and tools fit.
const Chars = (() => {
  const W = 26, H = 26, OX = 7, OY = 6;
  const BASE = { skin: "peach", pupil: "ink", mouth: "crimson", sweat: "blue", hair: "rust", tunic: "blue", belt: "umber",
                 pants: "navy", boots: "umber", metal: "silver", metalL: "white", wood: "brown", gold: "yellow", paper: "white",
                 cover: "crimson", line: "ash", straw: "cream", red: "red", gem: "blue", lens: "blue", white: "white" };
  const CAST = {
    builder: { name: "Smith", tool: "hammer", pal: { hair: "rust", tunic: "amber", band: "red", apron: "brown", pants: "ash" } },
    tidy: { name: "Sweeper", tool: "broom", pal: { hair: "cream", tunic: "blue", cap: "cobalt", apron: "white" } },
    code: { name: "Scholar", tool: "tome", robe: true, pal: { hair: "rust", tunic: "lavender", hood: "mauve" } },
    security: { name: "Knight", tool: "sword", pal: { hair: "orange", tunic: "cobalt", plume: "red", shield: "cobalt", trim: "yellow", pants: "grey" } },
    performance: { name: "Ranger", tool: "bow", pal: { hair: "orange", tunic: "jade", hood: "green", feather: "white", pants: "rust" } },
    stability: { name: "Dwarf", tool: "pick", pal: { hair: "amber", tunic: "brown", beard: "amber", horn: "white", pants: "grey" } },
    ui: { name: "Painter", tool: "palette", pal: { hair: "cream", tunic: "white", beret: "red", pants: "navy" } },
    ux: { name: "Bard", tool: "lute", pal: { hair: "rust", tunic: "pink", hat: "orange", feather: "white", pants: "plum" } },
    platform: { name: "Artificer", tool: "wrench", pal: { hair: "ash", tunic: "orange", apron: "brown", pants: "ash" } },
    codex: { name: "Sage", tool: "staff", robe: true, pal: { hair: "silver", tunic: "cobalt", hat: "cobalt", band: "yellow", beard: "white" } },
    herald: { name: "Herald", tool: "trumpet", pal: { hair: "yellow", tunic: "red", hat: "jade", feather: "white", tabard: "yellow" } },
  };
  const cast = (role) => CAST[role] || CAST.code;

  function pose(name, f) {
    switch (name) {
      case "walk": return { arm: "down", step: [1, 0, -1, 0][f], bob: f % 2 ? -1 : 0, swing: [1, 0, -1, 0][f] };
      case "hammer": return f ? { arm: "strike", item: "hammerDown" } : { arm: "raise", item: "hammerUp", bob: -1 };
      case "sweep": return { arm: "forward", item: f ? "broom1" : "broom0" };
      case "read": return { arm: "book", item: f ? "book1" : "book0" };
      case "cheer": return { arm: "up", back: "up", bob: f ? -2 : 0, mouth: "open" };
      case "angry": return { arm: "hips", bob: f ? 1 : 0, vein: true };
      case "sit": return { arm: "down", legs: "sit", low: 3 };
      case "call": return { arm: "present", item: "scroll", bob: f ? -1 : 0 };
      default: return { arm: "down", bob: f ? 1 : 0, hold: true };
    }
  }

  function head(g, o, mood, u) {
    g.rect(1, 0 + u, 8, 2, "hair"); g.rect(2, 2 + u, 8, 6, "skin"); g.rect(3, 8 + u, 6, 1, "skin"); g.set(10, 5 + u, "skin");
    g.rect(0, 1 + u, 3, 6, "hair"); g.rect(4, 2 + u, 2, 1, "hair"); g.set(3, 4 + u, "skin");
    g.rect(6, 4 + u, 1, 2, "pupil"); g.rect(8, 4 + u, 1, 2, "pupil");
    if (o.mouth === "open" || mood === "happy") g.rect(7, 7 + u, 2, 1, "mouth");

// The season by the calendar: it colours the trees, decides what falls from the sky, and lays snow.
const Season = ["winter", "winter", "spring", "spring", "spring", "summer", "summer", "summer", "autumn", "autumn", "autumn", "winter"][new Date().getMonth()];

    carts: { spots: [{ x: 774, face: "right" }, { x: 822, face: "right" }, { x: 870, face: "left" }] },

  const px = (ctx, c, x, y, w, h) => { ctx.fillStyle = C[c] || c; ctx.fillRect(x, y, w, h); };

  function wall(ctx, kind, x, y, w, h, r) {

    }
  }

    for (let i = 0; i < 18; i++) px(ctx, LEAVES[0], x - 14 + Math.floor(r() * 28), BASE - 58 + Math.floor(r() * 30), 2, 1);
    if (Season === "spring") for (let i = 0; i < 16; i++) px(ctx, i % 3 ? "pink" : "white", x - 13 + Math.floor(r() * 26), BASE - 62 + Math.floor(r() * 32), 2, 2);
    if (Season === "autumn") for (let i = 0; i < 12; i++) px(ctx, "yellow", x - 13 + Math.floor(r() * 26), BASE - 60 + Math.floor(r() * 30), 1, 1);
  }

  function lamp(ctx, x, y) { px(ctx, K, x, y, 2, BASE + 6 - y); px(ctx, K, x - 2, y - 6, 6, 6); px(ctx, "yellow", x - 1, y - 5, 4, 4); px(ctx, K, x - 1, y - 7, 4, 1); }

  // A thatched roof: straw that curves in towards a rounded ridge, with a thick lip at the eaves.
  const STRAW = ["#d9b25e", "#b48a3e"];
  function thatch(ctx, x, y, w, h, chimney) {
    if (chimney != null) { box(ctx, "crimson", x + chimney, y - h - 2, 5, 10); px(ctx, K, x + chimney - 1, y - h - 3, 7, 2); CHIMNEYS.push([x + chimney + 2, y - h - 4]); }
    const insetAt = (j) => { const k = (h - j) / h; return Math.round(k * k * w * .36); };
    for (let j = 0; j < h; j++) {
      const inset = insetAt(j), x0 = x - 4 + inset, width = w + 8 - 2 * inset;
      px(ctx, K, x0 - 1, y - h + j, width + 2, 1);
      px(ctx, Season === "winter" && j < 4 ? (j < 3 ? "white" : "silver") : STRAW[0], x0, y - h + j, width, 1);
      if (j > 3 && j % 3 === 0) for (let i = x0 + (j % 6 ? 1 : 3); i < x0 + width - 1; i += 4) px(ctx, STRAW[1], i, y - h + j, 1, 2);
    }
    px(ctx, K, x - 5, y - 1, w + 10, 3); px(ctx, STRAW[1], x - 4, y - 1, w + 8, 1);
  }

  function inn(ctx, r) {
    const x = 16, w = 108, y = BASE - 50;
    wall(ctx, "plaster", x, y, w, 50, r); timber(ctx, x, y, w, 50, 2);
    thatch(ctx, x, y, w, 24, 80);
    [[26, 100], [52, 100], [76, 100], [102, 100], [26, 122], [102, 122]].forEach(([wx, wy]) => windowAt(ctx, wx, wy, 9, 9, { shutter: "jade" }));
    [26, 102].forEach((wx) => { for (let i = 0; i < 9; i++) px(ctx, ["red", "pink", "jade"][i % 3], wx + i, 133, 1, 1); });
    awning(ctx, 46, 116, 46, "jade", "white");
    door(ctx, 64, 12, 18);
    sign(ctx, 38, 106, "mug");
    [[30, 136], [108, 136]].forEach(([bx]) => { box(ctx, "brown", bx, BASE - 9, 8, 9); px(ctx, "ash", bx, BASE - 7, 8, 1); px(ctx, "ash", bx, BASE - 3, 8, 1); });
  }

  function yard(ctx) {
    wall(ctx, "grey", 246, 120, 52, BASE - 120, () => .5);
    px(ctx, "green", 246, 114, 52, 6); px(ctx, K, 246, 113, 52, 1);
    for (let i = 0; i < 52; i += 3) px(ctx, "jade", 246 + i, 114, 2, 2);
    for (let i = 250; i < 298; i += 8) { px(ctx, K, i - 1, 132, 4, 14); px(ctx, "brown", i, 133, 2, 12); }
    px(ctx, K, 246, 135, 52, 4); px(ctx, "brown", 246, 136, 52, 2);
    DUMMIES.forEach((d) => {
      px(ctx, K, d - 1, 122, 3, 24); px(ctx, "brown", d, 123, 1, 22);
      px(ctx, K, d - 5, 127, 11, 3); px(ctx, "brown", d - 4, 128, 9, 1);
      px(ctx, K, d - 4, 126, 9, 12); px(ctx, "cream", d - 3, 127, 7, 10);
      px(ctx, "red", d - 2, 130, 5, 4); px(ctx, "white", d - 1, 131, 3, 2);
      px(ctx, K, d - 3, 117, 7, 7); px(ctx, "tan", d - 2, 118, 5, 5); px(ctx, K, d - 1, 120, 1, 1); px(ctx, K, d + 1, 120, 1, 1);
    });
  }

  function house(ctx, x, w, floors, kind, roofC, r, extra = {}) {
    const fh = 22, h = floors * fh + 6, y = BASE - h;
    wall(ctx, kind, x, y, w, h, r);
    if (extra.timber) timber(ctx, x, y, w, h, floors);
    if (roofC === "thatch") thatch(ctx, x, y, w, 18, extra.chimney ?? Math.round(w * .7));
    else roof(ctx, x, y, w, 14, roofC, extra.chimney ?? Math.round(w * .7));
    for (let f = 0; f < floors; f++) {
      const wy = y + 6 + f * fh;
      if (f === floors - 1) continue;
      for (let i = 0; i < Math.floor((w - 6) / 16); i++) windowAt(ctx, x + 7 + i * 16, wy, 8, 10, { shutter: extra.shutter, frame: "white", arch: extra.arch });
    }
    if (extra.awning) awning(ctx, x + 4, BASE - 26, w - 8, extra.awning[0], extra.awning[1]);
    door(ctx, x + Math.round(w / 2) - 5, 10, 16, extra.door || "brown");
  }

  // The chapel school, where the reviewers read: a stone nave with tall windows and a bell tower.
  function chapel(ctx, r) {
    const x = 384, w = 84, y = BASE - 50;
    wall(ctx, "stone", x, y, w, 50, r);
    roof(ctx, x, y, w, 22, "lavender", null);
    for (const wx of [396, 416, 436, 454]) windowAt(ctx, wx, BASE - 40, 7, 16, { arch: true, frame: "silver" });
    sign(ctx, 440, BASE - 22, "book");
    const tx = 362;
    wall(ctx, "stone", tx, BASE - 88, 24, 88, r);
    for (let j = 0; j < 18; j++) { const half = Math.round(j * .75) + 1; px(ctx, K, tx + 12 - half - 1, BASE - 106 + j, half * 2 + 2, 1); px(ctx, Season === "winter" && j < 6 ? "white" : j % 3 === 2 ? "mauve" : "lavender", tx + 12 - half, BASE - 106 + j, half * 2, 1); }
    px(ctx, K, tx + 11, BASE - 112, 2, 6); px(ctx, K, tx + 9, BASE - 110, 6, 1);
    px(ctx, K, tx + 6, BASE - 82, 12, 16); px(ctx, "ink", tx + 7, BASE - 81, 10, 15); px(ctx, "yellow", tx + 9, BASE - 78, 6, 6); px(ctx, "orange", tx + 9, BASE - 73, 6, 1);
    door(ctx, tx + 6, 12, 20, "rust");
  }

  // The village hall, where heralds wait with whatever needs you: a bell cupola on a timbered hall.
  function hall(ctx, r) {
    house(ctx, HALL - 40, 80, 2, "plaster", "red", r, { timber: true, awning: ["crimson", "white"], door: "rust", chimney: 10 });
    box(ctx, "white", HALL - 6, BASE - 70, 12, 10); px(ctx, K, HALL - 3, BASE - 68, 6, 6); px(ctx, "yellow", HALL - 2, BASE - 67, 4, 4);
    for (let j = 0; j < 8; j++) { const half = j + 1; px(ctx, K, HALL - half - 1, BASE - 78 + j, half * 2 + 2, 1); px(ctx, "red", HALL - half, BASE - 78 + j, half * 2, 1); }
    sign(ctx, HALL - 30, 110, "scroll");
    for (const bx of [HALL - 36, HALL + 26]) { box(ctx, "crimson", bx, 98, 8, 12); box(ctx, "yellow", bx + 2, 101, 4, 4); }
    cottage(ctx, HALL + 46, 40, "pink", { door: "teal", chimney: 6 });
  }

  // The dirt road everyone walks on, a grass bank behind it and the verge in front; the countryside
  // uses the same road, so the village runs into the fields without a seam.
  const GRASS = { spring: ["#7cc35a", "#5ca545"], summer: ["#5ca545", "#4a8a3c"], autumn: ["#a8a24a", "#8a7e3a"], winter: ["#eef3f6", "#d4dee6"] }[Season];
  function road(ctx, r, x0, w) {
    px(ctx, GRASS[0], x0, BASE - 4, w, 4); px(ctx, K, x0, BASE - 5, w, 1);
    for (let i = 0; i < w / 6; i++) px(ctx, GRASS[1], x0 + Math.floor(r() * w), BASE - 4 + Math.floor(r() * 3), 2, 1);
    px(ctx, K, x0, BASE, w, 1);
    px(ctx, Season === "winter" ? "#e4e8ec" : "#c9a46a", x0, BASE + 1, w, 11);
    for (let i = 0; i < w / 5; i++) px(ctx, Season === "winter" ? "silver" : i % 2 ? "#b08a50" : "#dcbc84", x0 + Math.floor(r() * w), BASE + 2 + Math.floor(r() * 9), 2, 1);
    if (Season === "autumn") for (let i = 0; i < w / 14; i++) px(ctx, ["amber", "orange", "rust"][i % 3], x0 + Math.floor(r() * w), BASE + 1 + Math.floor(r() * 11), 2, 1);
    px(ctx, K, x0, BASE + 12, w, 1);
    px(ctx, GRASS[0], x0, BASE + 13, w, H - BASE - 13);
    for (let i = 0; i < w / 3; i++) px(ctx, GRASS[1], x0 + Math.floor(r() * w), BASE + 14 + Math.floor(r() * (H - BASE - 15)), 2, 1);
  }

  // A one-storey cottage: thatch or tiles, a window either side of the door with shutters and a
  // flower box.
  function cottage(ctx, x, w, kind, { roof: roofC = "thatch", shutter = null, door: doorC = "brown", chimney = Math.round(w * .7), timbered = false } = {}) {
    const h = 30, y = BASE - h, dx = x + Math.round(w / 2) - 5;
    wall(ctx, kind, x, y, w, h, () => .5);
    if (timbered) timber(ctx, x, y, w, h, 1);
    if (roofC === "thatch") thatch(ctx, x, y, w, 18, chimney); else roof(ctx, x, y, w, 14, roofC, chimney);
    door(ctx, dx, 10, 16, doorC);
    for (const wx of [x + 5, x + w - 13]) {
      if (Math.abs(wx - dx) < 12) continue;
      windowAt(ctx, wx, y + 8, 8, 8, { shutter });
      for (let i = 0; i < 8; i++) px(ctx, Season === "winter" ? "white" : ["red", "pink", "yellow"][i % 3], wx + i, y + 18, 1, 1);
    }
  }

  function picket(ctx, x0, x1) {
    px(ctx, K, x0 - 1, BASE - 6, x1 - x0 + 2, 3); px(ctx, "white", x0, BASE - 5, x1 - x0, 1);
    for (let x = x0; x <= x1; x += 4) { px(ctx, K, x - 1, BASE - 9, 3, 9); px(ctx, "white", x, BASE - 8, 1, 8); }
  }

  function garden(ctx, x0, x1) {
    px(ctx, Season === "winter" ? "silver" : "#8a5a34", x0, BASE - 4, x1 - x0, 3);
    for (let x = x0 + 2; x < x1 - 3; x += 6) {
      if (Season === "winter") { box(ctx, "white", x, BASE - 6, 4, 3); continue; }
      const c = Season === "autumn" ? ["orange", "amber"] : ["green", "lime"];
      px(ctx, K, x - 1, BASE - 8, 6, 5); px(ctx, c[0], x, BASE - 7, 4, 3); px(ctx, c[1], x + 1, BASE - 7, 2, 1);

  }

  function well(ctx, x) {
    for (const px0 of [x - 7, x + 6]) { px(ctx, K, px0 - 1, BASE - 26, 3, 20); px(ctx, "brown", px0, BASE - 25, 1, 18); }
    for (let j = 0; j < 7; j++) { px(ctx, K, x - 3 - j - 1, BASE - 32 + j, 8 + 2 * j, 1); px(ctx, Season === "winter" && j < 2 ? "white" : "rust", x - 3 - j, BASE - 32 + j, 6 + 2 * j, 1); }
    px(ctx, K, x - 1, BASE - 25, 1, 8); box(ctx, "brown", x - 2, BASE - 18, 4, 4);
    box(ctx, "grey", x - 9, BASE - 9, 19, 9); for (let i = x - 8; i < x + 10; i += 4) px(ctx, "ash", i, BASE - 8, 1, 7);
  }

  // The smithy: an open shed with a stone forge and its chimney, tools on the back wall.
  function smithy(ctx, r) {
    const x = 150, w = 92, y = BASE - 36;
    wall(ctx, "stone", x, y, w, 36, r);
    roof(ctx, x, y, w, 14, "brown", null);
    px(ctx, K, x + 24, y + 6, w - 28, 30); px(ctx, "umber", x + 25, y + 7, w - 30, 29);
    [[200, y + 10], [206, y + 12], [212, y + 9]].forEach(([tx, ty]) => px(ctx, "silver", tx, ty, 1, 7));
    box(ctx, "grey", x + 2, y + 6, 20, 30);
    px(ctx, K, x + 5, y + 12, 14, 12);
    box(ctx, "grey", x + 6, y - 34, 12, 40); for (let j = y - 30; j < y; j += 5) px(ctx, "ash", x + 6, j, 12, 1);
    px(ctx, K, x + 5, y - 36, 14, 2);
    for (const postX of [x + 22, x + w - 3]) { px(ctx, K, postX - 1, y, 4, 36); px(ctx, "brown", postX, y, 2, 36); }
    sign(ctx, 196, y + 8, "anvil");
    ANVILS.forEach((ax) => { px(ctx, K, ax - 7, BASE - 9, 15, 4); px(ctx, "silver", ax - 6, BASE - 8, 13, 2); px(ctx, K, ax - 3, BASE - 5, 7, 5); px(ctx, "grey", ax - 2, BASE - 5, 5, 4); });
  }

  // The stable at the end of the road, where the carts wait to carry finished work off.
  function stable(ctx, r) {
    const x = 772, w = 112, y = BASE - 40;
    box(ctx, "brown", x, y, w, 40);
    for (let i = x + 4; i < x + w - 2; i += 5) px(ctx, "rust", i, y + 1, 1, 38);
    thatch(ctx, x, y, w, 20, null);
    px(ctx, K, x + w / 2 - 9, y - 12, 18, 11); px(ctx, "umber", x + w / 2 - 8, y - 11, 16, 9); px(ctx, STRAW[0], x + w / 2 - 7, y - 6, 14, 4);
    for (const dx of [x + 8, x + w - 34]) {
      px(ctx, K, dx - 1, BASE - 25, 28, 25); px(ctx, "brown", dx, BASE - 24, 26, 24);
      for (let k = 0; k < 24; k++) { px(ctx, "rust", dx + Math.round(k * 26 / 24), BASE - 24 + k, 1, 1); px(ctx, "rust", dx + 25 - Math.round(k * 26 / 24), BASE - 24 + k, 1, 1); }
    }
    sign(ctx, x + 50, BASE - 34, "letter");
  }

  function staticLayer() {
    WINDOWS.length = 0; CHIMNEYS.length = 0;
    const c = Gfx.canvas(W, H - TOP), ctx = c.getContext("2d"), r = Gfx.rnd(9);
    ctx.translate(0, -TOP);
    road(ctx, r, 0, W);
    inn(ctx, r);
    smithy(ctx, r);
    yard(ctx);
    cottage(ctx, 308, 46, "pink", { shutter: "teal" });
    chapel(ctx, r);
    garden(ctx, 472, 498);
    well(ctx, 510);
    cottage(ctx, 524, 38, "plaster", { timbered: true, door: "teal" });
    hall(ctx, r);
    cottage(ctx, 698, 44, "plaster", { shutter: "jade", timbered: true });
    garden(ctx, 746, 768);
    stable(ctx, r);
    cottage(ctx, 904, 44, "pink", { roof: "red", shutter: "jade" });
    [140, 690, 892, 956].forEach((x) => tree(ctx, x, r));
    LAMPS.forEach(([x, y]) => lamp(ctx, x, y));
    box(ctx, "brown", BOARD - 1, BASE - 26, 24, 16); px(ctx, K, BOARD + 1, BASE - 10, 2, 11); px(ctx, K, BOARD + 19, BASE - 10, 2, 11);
    px(ctx, "rust", BOARD + 2, BASE - 10, 1, 10); px(ctx, "rust", BOARD + 20, BASE - 10, 1, 10);
    return c;
  }

  return { W, H, TOP, VH, GROUND, BASE, STATIONS, ANVILS, DUMMIES, CARTS, BOARD, HALL, DOOR, FORGE_GLOW, FORGE_SMOKE, WINDOWS, CHIMNEYS, LAMPS, staticLayer,
           draw: { px, box, tree, road, GRASS } };
})();

// The countryside on both sides of the village, as far as the screen reaches: 200-wide pieces of
// fields, woods, pasture, meadow, a pond and a farm, each drawn once from its own seed. Chunk 0 is
// the first piece right of the village, chunk -1 the first to its left.
const Land = (() => {
  const { BASE, H, TOP, W } = World, { px, box, tree, road, GRASS } = World.draw, C = Gfx.C, K = C.black, CH = 200;
  const CROP = { spring: ["#5ca545", "#8a5a34"], summer: ["#4a8a3c", "#7cc35a"], autumn: ["#e8c04a", "#c49a32"], winter: ["#eef3f6", "#c4cfd8"] }[Season];
  const chunks = new Map();

  const kindOf = (i) => i === 0 ? "farm" : i === -1 ? "field" : i === 1 ? "pasture" : i === -2 ? "pond"
    : ["woods", "field", "meadow", "pasture", "woods", "pond", "meadow"][Math.floor(Gfx.rnd(97 + i * 31)() * 7)];
  const left = (i) => (i < 0 ? i * CH : W + i * CH);

  function fence(ctx, x0, x1) {
    for (let x = x0; x < x1; x += 10) { px(ctx, K, x - 1, BASE - 12, 4, 12); px(ctx, "brown", x, BASE - 11, 2, 11); }
    for (const y of [BASE - 10, BASE - 5]) { px(ctx, K, x0 - 1, y - 1, x1 - x0, 3); px(ctx, "tan", x0, y, x1 - x0 - 2, 1); }
  }
  function bush(ctx, x, w) {
    px(ctx, K, x - 1, BASE - 8, w + 2, 8); px(ctx, K, x + 1, BASE - 10, w - 2, 2);
    px(ctx, Season === "winter" ? "silver" : LEAF[0], x, BASE - 7, w, 7); px(ctx, Season === "winter" ? "white" : LEAF[1], x + 2, BASE - 9, w - 4, 4);
  }
  const LEAF = { spring: ["green", "jade"], summer: ["green", "jade"], autumn: ["rust", "amber"], winter: ["silver", "white"] }[Season];

  function field(ctx, r, anims) {
    px(ctx, Season === "winter" ? "#d4dee6" : "#8a5a34", 6, BASE - 6, CH - 12, 2);
    for (let x = 8; x < CH - 8; x += 3) {
      const h = Season === "spring" ? 3 + Math.floor(r() * 2) : 10 + Math.floor(r() * 4);
      px(ctx, CROP[0], x, BASE - 5 - h, 1, h);
      if (Season === "autumn" || Season === "summer") px(ctx, CROP[1], x, BASE - 5 - h, 2, 3);
    }
    const sx = 60 + Math.floor(r() * 80);
    px(ctx, K, sx - 1, BASE - 34, 3, 30); px(ctx, "brown", sx, BASE - 33, 1, 28);
    px(ctx, K, sx - 8, BASE - 26, 17, 3); px(ctx, "brown", sx - 7, BASE - 25, 15, 1);
    box(ctx, "tan", sx - 3, BASE - 40, 7, 7); px(ctx, K, sx - 1, BASE - 37, 1, 1); px(ctx, K, sx + 1, BASE - 37, 1, 1);
    px(ctx, K, sx - 5, BASE - 42, 11, 2); px(ctx, "rust", sx - 3, BASE - 44, 7, 2);
    box(ctx, "blue", sx - 3, BASE - 30, 7, 8);
    fence(ctx, 4, CH - 4);
  }

  function woods(ctx, r) {
    const xs = [20, 60, 100, 140, 180].map((x) => x + Math.floor(r() * 14) - 7);
    xs.forEach((x, k) => { if (k % 2) bush(ctx, x - 10, 14); });
    xs.forEach((x) => tree(ctx, x, r));
    bush(ctx, 34, 12); bush(ctx, 150, 16);
  }

  function meadow(ctx, r) {
    tree(ctx, 50 + Math.floor(r() * 100), r);
    for (let i = 0; i < 36; i++) { const x = Math.floor(r() * CH), c = ["pink", "white", "yellow", "lavender"][i % 4]; px(ctx, K, x - 1, BASE - 7, 3, 3); px(ctx, Season === "winter" ? "white" : c, x, BASE - 6, 1, 1); px(ctx, GRASS[1], x, BASE - 4, 1, 3); }
    box(ctx, "grey", 150, BASE - 6, 10, 6); box(ctx, "grey", 158, BASE - 4, 6, 4);
    bush(ctx, 20, 18);
  }

  function pasture(ctx, r, anims) {
    tree(ctx, 170, r);
    bush(ctx, 10, 14);
    anims.push({ kind: "cow", x: 50, range: 30, seed: r() * 6 }, { kind: "sheep", x: 110, range: 26, seed: r() * 6 }, { kind: "sheep", x: 136, range: 20, seed: r() * 6 });
    fence(ctx, 4, CH - 4);
  }

  function pond(ctx, r, anims) {
    const c = Season === "winter" ? ["#cfe2ee", "#eef6fb"] : [C.cobalt, C.blue];
    for (let j = 0; j < 6; j++) { const half = Math.round(Math.sqrt(36 - j * j) * 12); px(ctx, K, 100 - half - 1, BASE - 1 - j, half * 2 + 2, 1); px(ctx, j < 2 ? c[0] : c[1], 100 - half, BASE - 1 - j, half * 2, 1); }
    for (const rx of [28, 34, 162, 168, 172]) { px(ctx, K, rx - 1, BASE - 16, 3, 12); px(ctx, "green", rx, BASE - 15, 1, 11); px(ctx, "brown", rx, BASE - 17, 1, 3); }
    if (Season !== "winter") anims.push({ kind: "duck", x: 80, range: 24, seed: 1 }, { kind: "duck", x: 120, range: 18, seed: 3 });
    tree(ctx, 186, r);
  }

  function farm(ctx, r, anims) {
    // A post mill as on Öland: a falu-red box resting on a low stone base, its tail pole to the ground.
    const mx = 46, falu = "#8e2f22", tar = "#5e2016";
    box(ctx, "grey", mx - 15, BASE - 10, 30, 10); for (let i = mx - 13; i < mx + 14; i += 5) px(ctx, "ash", i, BASE - 9, 1, 8);
    for (let k = 0; k < 26; k++) { px(ctx, K, mx + 10 + Math.round(k * .8), BASE - 28 + k, 3, 2); px(ctx, "brown", mx + 11 + Math.round(k * .8), BASE - 28 + k, 1, 1); }
    box(ctx, falu, mx - 12, BASE - 48, 24, 37);
    for (let i = mx - 9; i < mx + 11; i += 4) px(ctx, tar, i, BASE - 47, 1, 35);
    for (let j = 0; j < 10; j++) { const half = 2 + Math.round(j * 1.25); px(ctx, K, mx - half - 1, BASE - 58 + j, half * 2 + 2, 1); px(ctx, Season === "winter" && j < 3 ? "white" : tar, mx - half, BASE - 58 + j, half * 2, 1); }
    px(ctx, K, mx + 2, BASE - 26, 6, 15); px(ctx, "umber", mx + 3, BASE - 25, 4, 14);
    px(ctx, K, mx - 6, BASE - 44, 5, 5); px(ctx, "yellow", mx - 5, BASE - 43, 3, 3);
    anims.push({ kind: "mill", x: mx - 13, y: BASE - 38 });
    const bx = 104, bw = 70, by = BASE - 40;
    box(ctx, "red", bx, by, bw, 40);
    for (let i = bx + 4; i < bx + bw - 2; i += 6) px(ctx, "crimson", i, by + 1, 1, 38);
    for (let j = 0; j < 20; j++) {
      const inset = 20 - j, x0 = bx - 4 + inset, width = bw + 8 - 2 * inset;

// Who stands where: the board's jobs as a cast of actors with a station, a pose and a mark, and the
// walking along the street that gets each actor there.
const Village = (() => {
  const { STATIONS } = World;
  const SPEED = 26;
  let actors = [], seq = 0;

  const moodOf = (confidence) => confidence == null ? null : confidence >= 8 ? "happy" : confidence >= 5 ? null : "worried";

  // One wanted actor per job and role from the job's step; the rest of the roster idles at the tavern.
  function wanted(jobs, roster) {
    const want = [];
    const add = (job, role, station, poseName, mark) => want.push({ job: job.id, role, station, pose: poseName, mark,
                                                                     mood: role === "herald" ? moodOf(job.confidence) : null });
    for (const job of jobs) {
      const steps = job.pipeline || [];
      const cur = steps.find((s) => ["active", "waiting", "blocked"].includes(s.status)) || {};
      const running = (role) => (job.runs || []).some((r) => r.role === role && r.status === "running");
      const reviewers = (steps.find((s) => s.key === "review") || {}).reviewers || [];
      const d = job.decision || {};
      if (job.stage === "unknown") continue;
      if (d.kind === "question" || d.kind === "stopped" || cur.key === "approve") {
        add(job, "herald", "hall", "call", d.kind === "question" ? "ask" : d.kind === "stopped" ? "stop" : "bang");
        if (d.kind === "question" || d.kind === "stopped") add(job, "builder", "forge", "sit", "ask");
        if (cur.key === "review") reviewers.filter((r) => r.status === "CHANGES").forEach((r) => add(job, r.name, "library", "angry", "no"));
        continue;
      }
      switch (cur.key) {
        case "start": add(job, "builder", "forge", "idle", "wait"); break;
        case "build": add(job, "builder", "forge", running("builder") ? "hammer" : "idle", running("builder") ? null : "wait"); break;
        case "verify": add(job, "builder", "verify", "hammer", null); break;
        case "tidy": add(job, "tidy", "yard", running("tidy") ? "sweep" : "idle", running("tidy") ? null : "wait"); break;
        case "review":
          reviewers.forEach((r) => add(job, r.name, "library",
            r.status === "running" ? "read" : r.status === "PASS" ? "cheer" : r.status === "CHANGES" ? "angry" : "idle",
            r.status === "PASS" ? "ok" : r.status === "CHANGES" ? "no" : r.status === "running" ? null : "wait"));
          break;
        case "pr": add(job, "herald", "carts", job.confidence >= 8 ? "cheer" : "idle", null); break;
      }
    }
    const busy = new Set(want.map((w) => w.role));
    roster.filter((role) => !busy.has(role)).forEach((role) => want.push({ job: null, role, station: "tavern", pose: "idle" }));
    const used = {};
    for (const w of want) {
      const st = STATIONS[w.station], i = used[w.station] = (used[w.station] ?? -1) + 1;
      const spot = st.spots[i % st.spots.length];
      Object.assign(w, { x: spot.x + (i >= st.spots.length ? 5 : 0), face: spot.face });
    }
    return want;
  }

  function update(jobs, roster, snap) {
    const want = wanted(jobs, roster);
    const free = new Set(actors);
    const pick = (w) => actors.find((a) => free.has(a) && a.role === w.role && a.job === w.job)
                     || actors.find((a) => free.has(a) && a.role === w.role && !a.job)
                     || actors.find((a) => free.has(a) && a.role === w.role);
    const next = [], arrivals = [];
    for (const w of want) {
      let a = pick(w);
      if (a) free.delete(a);
      else a = { id: ++seq, role: w.role, x: World.DOOR, dir: "right" };
      if (snap) a.x = w.x;
      else if (a.tx !== w.x && w.job) arrivals.push(w);
      Object.assign(a, { job: w.job, station: w.station, pose: w.pose, mark: w.mark, mood: w.mood, face: w.face, tx: w.x, leaving: false });
      next.push(a);
    }
    for (const a of free) {
      if (snap) continue;
      Object.assign(a, { leaving: true, job: null, mark: null, pose: "idle", tx: World.DOOR });
      next.push(a);
    }
    actors = next;
    return arrivals;
  }

  function step(dt) {
    for (const a of actors) {
      const dx = a.tx - a.x;
      if (Math.abs(dx) < .5) { a.x = a.tx; continue; }
      a.dir = dx > 0 ? "right" : "left";
      a.x += Math.sign(dx) * Math.min(Math.abs(dx), SPEED * dt);
    }
    actors = actors.filter((a) => !(a.leaving && a.x === a.tx));
  }

  const walking = (a) => a.x !== a.tx;
  return { update, step, walking, all: () => actors };
})();

// The sky by the local clock: day, dusk or night, each a few flat bands of the palette.
const Sky = (() => {
  const C = Gfx.C;

    return { bands: [C.ink, C.ink, C.navy, C.navy], cloud: [C.lavender, C.mauve], far: ["#2f3d6b", "#262a40", "#9aa8c8", "#26364a", "#1e2a3a"], dark: .45, h };
  }
  return { at };
})();

// Drawing one frame through the camera, and finding what is under the pointer.

    if (d && d.kind === "question") {
      const options = (d.options || []).map((o, i) =>
        `<label class="opt"><input type="radio" name="answer" value="(${esc(o.key)}) ${esc(o.text)}"${o.recommended || (!i && !d.options.some((x) => x.recommended)) ? " checked" : ""}>`
        + `<span><strong>(${esc(o.key)})</strong> ${esc(o.text)}${o.recommended ? ` <span class="rec">recommended</span>` : ""}</span></label>`).join("");
      return { html: `<h3>Your decision</h3>${d.question ? `<p class="q">${esc(d.question)}</p>` : ""}`
        + `<div class="ctx">${markdown(d.context || "")}</div>`
        + `<fieldset class="opts"><legend class="sr">Options</legend>${options}`
        + `<label class="opt"><input type="radio" name="answer" value=""${options ? "" : " checked"}><span>Your own answer</span></label>`
        + `<textarea id="act-text" aria-label="Your own answer" placeholder="Your own answer"></textarea></fieldset>`,
        acts: [["answer", "Answer and continue", "primary"], ...cancel] };
    }
    if (d && d.kind === "approve") {
      const least = (d.least_sure || []).map((l) => `<li>${markdown(l).replace(/^<p>|<\/p>$/g, "")}</li>`).join("");
      return { html: `<h3>Ready for your approval</h3>${d.summary ? `<div class="ctx">${markdown(d.summary)}</div>` : ""}`
        + checksLine(d.checks)
        + (job.confidence != null ? `<p class="note">The reviewer's confidence: ${esc(job.confidence)}/10</p>` : "")
        + (least ? `<p class="lead">Check before you approve — the reviewer is least sure of:</p><ol class="least">${least}</ol>`
                 : `<p class="note">The reviewer named nothing it is unsure of.</p>`)
        + ((d.unrendered || []).length ? `<p class="lead">Not looked at in a browser — check the change by eye:</p><ul class="least">`
            + d.unrendered.map((u) => `<li><strong>${esc(u.reviewer)}</strong> — ${esc(u.why)}</li>`).join("") + `</ul>` : "")
        + ((d.findings || []).length ? `<p class="lead">The reviewers left these for you:</p><ul class="least">`
            + d.findings.map((f) => `<li><strong>${esc(f.reviewer)}</strong> — ${markdown(f.text).replace(/^<p>|<\/p>$/g, "")}</li>`).join("") + `</ul>` : "")
        + ((d.exemptions || []).length ? `<p class="lead">Not covered by an automated test — check by hand:</p><ul class="least">`
            + d.exemptions.map((e) => `<li>${markdown(e).replace(/^<p>|<\/p>$/g, "")}</li>`).join("") + `</ul>` : "")
        + (d.test_note ? `<p class="lead">Test note — posted with the PR, or to Jira when you merge:</p><div class="ctx">${markdown(d.test_note)}</div>`
                       : `<p class="note">No test note: nobody but you needs to verify this by hand.</p>`)
        + `<textarea id="act-text" aria-label="Rework note" placeholder="Rework note — what to change"></textarea>`,
        acts: [...(d.publish === "both" ? [["approve", "Publish PR", "primary"], ["approve-auto", "Publish PR with autocomplete", ""]]
                 : d.publish === "auto" ? [["approve-auto", "Publish PR with autocomplete", "primary"]]
                 : d.publish === "merge" ? [["approve", "Merge", "primary"]]
                 : [["approve", "Approve", "primary"]]),
               ["rework", "Rework", ""], ...cancel] };
    }
    if (d && d.kind === "stopped") {
      return { html: `<h3>Stopped — needs you</h3><p class="q">${esc(d.reason)}</p>`
        + `<textarea id="act-text" aria-label="Rework note" placeholder="Rework note — what to do next"></textarea>`,
        acts: [["rework", "Rework", "primary"], ...cancel] };
    }
    const rework = job.stage === "pr-open" ? [["rework", "Rework", ""]] : [];
    if (!rework.length && !cancel.length) return { html: "", acts: [] };
    return { html: `<textarea id="act-text" aria-label="Rework note or reason for cancelling" placeholder="Rework note, or reason for cancelling"></textarea>`,
             acts: [...rework, ...cancel] };
  }

  function actions(job) {
    const { html, acts } = decision(job);
    return html + (acts.length ? `<div class="btns">${acts.map(([cmd, label, cls]) =>
      `<button class="btn ${cls}" data-cmd="${cmd}">${label}</button>`).join("")}<span class="note" id="act-status" role="status"></span></div>` : "");
  }

  function decisionKey(job) {
    const d = job.decision || {};
    return [job.stage, d.kind, d.question, d.context].join("|");
  }

  function lockButtons() {
    document.querySelectorAll("#dlg-acts button[data-cmd]").forEach((b) => { b.disabled = sending || pending; });
  }

  const STATE_TEXT = { queued: "Queued", applied: "Applied", refused: "Refused" };
  function commandLine(c) {
    const when = new Date(c.done_at || c.at).toLocaleTimeString();
    const detail = c.status === "queued" ? "waiting for the orchestrator" : c.outcome || "";
    return `<div class="cmd"><span class="state ${esc(c.status)}">${esc(STATE_TEXT[c.status] || c.status)}</span>`
      + `<span>${esc(c.command)} · ${esc(when)}${detail ? ` — ${esc(detail)}` : ""}</span></div>`;
  }

  async function loadCommands(id) {
    try {
      const { commands } = await (await api(`/commands?job=${encodeURIComponent(id)}`)).json();
      if (openJob !== id) return;
      pending = commands.some((c) => c.status === "queued");
      $("dlg-cmds").innerHTML = commands.slice().reverse().map(commandLine).join("");
      lockButtons();
    } catch (e) { /* the next refresh tries again */ }
  }

  async function send(job, picked) {
    if (sending || pending) return;
    const auto = picked === "approve-auto";
    const command = auto ? "approve" : picked;
    let text = ($("act-text") || {}).value || "";
    if (command === "answer") {
      const picked = document.querySelector('#dlg-acts input[name="answer"]:checked');
      if (picked && picked.value) text = picked.value;
      if (!text.trim()) { $("act-status").textContent = "Pick an option or write your answer."; return; }
    }
    if (command === "rework" && !text.trim()) { $("act-status").textContent = "Rework needs a note."; return; }
    if (command === "cancel" && !confirm(`Cancel ${job.id}? This closes its PR and deletes its branch.`)) return;
    sending = true; lockButtons();
    $("act-status").textContent = `Sending ${command}…`;
    try {
      await api("/command", { method: "POST", headers: { "Content-Type": "application/json" },
                              body: JSON.stringify({ command, job: job.id, text, by: "dashboard", auto }) });
      $("act-status").textContent = "";
      pending = true;
    } catch (e) { $("act-status").textContent = e.message; }
    sending = false;
    await loadCommands(job.id);
  }

  function fillHeader(job) {
    $("dlg-id").textContent = `${job.id} · ${job.stage}`;
    $("dlg-title").textContent = job.title || job.id;
    $("dlg-reason").textContent = job.decision ? "" : job.reason || "";
    $("dlg-story").innerHTML = story(job);
  }

  function fillFiles(job) {
    const files = job.files || [];
    openFiles = files.join("\n");
    const current = document.querySelector('#dlg-files button[aria-current="true"]');
    $("dlg-files").innerHTML = files.map((f) => `<button data-path="${esc(f)}">${esc(f)}</button>`).join("") || `<div class="empty">No files yet</div>`;
    $("dlg-files").querySelectorAll("button").forEach((b) => {
      b.setAttribute("aria-current", String(!!current && b.dataset.path === current.dataset.path));
      b.addEventListener("click", () => show(job, b.dataset.path));
    });
  }

  function fillActions(job) {
    openStage = decisionKey(job);
    $("dlg-acts").innerHTML = actions(job);
    $("dlg-acts").querySelectorAll("button[data-cmd]").forEach((b) => b.addEventListener("click", () => send(job, b.dataset.cmd)));
    const own = $("dlg-acts").querySelector('input[name="answer"][value=""]');
    if (own) $("act-text").addEventListener("input", () => { own.checked = true; });
    lockButtons();
  }

  function open(id) {
    const job = (board.jobs || []).find((j) => j.id === id); if (!job) return;
    openJob = id; pending = false; sending = false;
    fillHeader(job);
    $("dlg-doc").innerHTML = "";
    $("dlg-cmds").innerHTML = "";
    fillFiles(job);
    fillActions(job);
    const files = job.files || [];
    const asked = job.decision && job.decision.kind === "question" && job.next
      ? `round-${job.next.round}/ruling-${job.next.attempt}.md` : null;
    const first = [asked, "decision.md", "spec.md"].find((f) => f && files.includes(f)) || files[0];
    if (first) show(job, first);
    if (!$("dlg").open) $("dlg").showModal();
    loadCommands(id);
  }

  // The open dialog follows the board: header always, files and actions only when they changed, so a
  // half-written rework note survives every refresh that doesn't move the job.
  function followOpen() {
    const job = (board.jobs || []).find((j) => j.id === openJob); if (!job) return;
    fillHeader(job);
    if ((job.files || []).join("\n") !== openFiles) fillFiles(job);
    if (decisionKey(job) !== openStage) fillActions(job);
    loadCommands(job.id);
  }

  $("title").innerHTML = T("FACTORY QUEST", "#ffd75e", 3, "#5b2a12");
  $("dlg-close").addEventListener("click", () => $("dlg").close());
  $("dlg").addEventListener("close", () => { openJob = null; });

  async function refresh() {
    try {
      board = await (await api("/board.json")).json();
      render();
      if (openJob) followOpen();
    } catch (e) {
      $("meta").innerHTML = `<span class="error">${esc(e.message)}</span>`;
    }
  }
  if (!token) { $("meta").innerHTML = `<span class="error">Open the URL the server printed; it carries the token.</span>`; return; }
  fit();
  if (!still) requestAnimationFrame(frame);
  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
