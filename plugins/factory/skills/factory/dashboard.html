<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory board</title>
<style>
  :root {
    --bg: #f6f6f4; --surface: #ffffff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e3e2dd;
    --accent: #2f5fd0; --pass: #1f7a4d; --pass-bg: #e3f3ea; --changes: #a33b1f; --changes-bg: #fbe7e1;
    --pending: #8a8a83; --pending-bg: #efefeb; --human: #b45309; --human-bg: #fff4e5;
    --radius: 10px; --shadow: 0 1px 2px rgb(0 0 0 / .06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --surface: #1d1d1b; --ink: #ecebe6; --muted: #9b9a93; --line: #2f2f2c;
      --accent: #7ea2ff; --pass: #6fd3a0; --pass-bg: #173326; --changes: #ff9a7a; --changes-bg: #3a1d15;
      --pending: #8f8e87; --pending-bg: #262624; --human: #ffb45c; --human-bg: #3a2810;
      --shadow: none; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; padding: 16px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12.5px; }
  .stopping { color: var(--human); font-weight: 600; }
  main { padding: 0 16px 32px; }
  .attention { margin-bottom: 18px; }
  .lanes { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; align-items: start; }
  .lane h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
             margin: 0 0 8px; font-weight: 600; display: flex; justify-content: space-between; }
  .card { width: 100%; text-align: left; background: var(--surface); color: inherit; border: 1px solid var(--line);
          border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px 12px; margin: 0 0 8px;
          cursor: pointer; font: inherit; display: block; }
  .card:hover { border-color: var(--accent); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.human { border-color: var(--human); background: var(--human-bg); }
  .card .id { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card .title { font-weight: 600; margin: 2px 0 6px; overflow-wrap: anywhere; }
  .card .reason { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .card.human .reason { color: var(--human); }
  .rounds { display: grid; gap: 4px; margin: 6px 0; }
  .round { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .round .n { font-size: 11px; color: var(--muted); width: 22px; }
  .chip { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--pending-bg); color: var(--pending); }
  .chip.PASS { background: var(--pass-bg); color: var(--pass); }
  .chip.CHANGES { background: var(--changes-bg); color: var(--changes); }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }
  dialog { width: min(880px, calc(100vw - 32px)); max-height: calc(100vh - 48px); border: 1px solid var(--line);
           border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink); }
  dialog::backdrop { background: rgb(0 0 0 / .35); }
  .dlg-head { display: flex; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .dlg-head h2 { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
  .dlg-body { display: grid; grid-template-columns: 180px 1fr; min-height: 300px; }
  @media (max-width: 640px) { .dlg-body { grid-template-columns: 1fr; } }
  .files { border-right: 1px solid var(--line); padding: 8px; overflow: auto; max-height: 65vh; }
  .files button { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit;
                  font: inherit; font-size: 12.5px; padding: 4px 6px; border-radius: 6px; cursor: pointer; overflow-wrap: anywhere; }
  .files button[aria-current="true"] { background: var(--pending-bg); font-weight: 600; }
  .doc { padding: 12px 18px; overflow: auto; max-height: 65vh; min-width: 0; }
  .doc pre { background: var(--pending-bg); padding: 10px; border-radius: 8px; overflow: auto; }
  .doc code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .doc table { border-collapse: collapse; } .doc td, .doc th { border: 1px solid var(--line); padding: 3px 8px; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: center; }
  .acts textarea { flex: 1 1 260px; min-height: 38px; font: inherit; padding: 6px 8px; border-radius: 8px;
                   border: 1px solid var(--line); background: var(--bg); color: inherit; }
  .btn { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg);
         color: inherit; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--changes); }
  .btn:focus-visible, .files button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .cmds { display: grid; gap: 4px; padding: 0 16px 12px; font-size: 12.5px; }
  .cmds:empty { display: none; }
  .cmd { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; overflow-wrap: anywhere; }
  .cmd .state { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
  .cmd .state.queued { background: var(--pending-bg); color: var(--ink); }
  .cmd .state.applied { background: var(--pass-bg); color: var(--pass); }
  .cmd .state.refused { background: var(--changes-bg); color: var(--changes); }
  .note { font-size: 12.5px; color: var(--muted); }
  .error { color: var(--changes); padding: 16px; }
  @media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } }
</style>
</head>
<body>
<header>
  <h1>Factory board</h1>
  <span class="meta" id="meta">Loading…</span>
</header>
<main>
  <section class="attention" id="attention" aria-label="Needs a human"></section>
  <div class="lanes" id="lanes"></div>
</main>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-head">
    <div><div class="note" id="dlg-id"></div><h2 id="dlg-title"></h2><div class="note" id="dlg-reason"></div></div>
    <button class="btn" id="dlg-close" aria-label="Close">Close</button>
  </div>
  <div class="dlg-body">
    <nav class="files" id="dlg-files" aria-label="Job files"></nav>
    <article class="doc" id="dlg-doc"></article>
  </div>
  <div class="acts" id="dlg-acts"></div>
  <div class="cmds" id="dlg-cmds" role="status" aria-live="polite" aria-label="Commands for this job"></div>
</dialog>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  let token = params.get("token");
  try {
    if (token) { sessionStorage.setItem("factory-token", token); history.replaceState(null, "", "/"); }
    else token = sessionStorage.getItem("factory-token");
  } catch (e) { /* storage unavailable: keep the token in memory only */ }

  const LANES = [
    ["Queued", ["queued", "starting"]], ["Tests", ["testing"]], ["Building", ["building"]],
    ["Review", ["reviewing"]], ["Approval", ["approving"]], ["Merge", ["rebasing", "merging"]],
    ["PR open", ["pr-open"]], ["Done", ["merged", "done", "cancelled"]],
  ];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let board = { jobs: [] }, openJob = null, openStage = null, openFiles = "", sending = false, pending = false;

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { "X-Factory-Token": token || "", ...(opts.headers || {}) } });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    return res;
  }

  function rounds(job) {
    const entries = Object.entries(job.verdicts || {});
    if (!entries.length) return "";
    return `<div class="rounds">${entries.slice(-3).map(([n, v]) =>
      `<div class="round"><span class="n">R${esc(n)}</span>${Object.entries(v).map(([name, verdict]) =>
        `<span class="chip ${esc(verdict || "")}" title="${esc(name)}: ${esc(verdict || "pending")}">${esc(name)}</span>`).join("")}</div>`).join("")}</div>`;
  }

  function card(job) {
    const human = job.stage === "needs-human";
    const why = human ? job.reason : (job.next && job.next.action !== "none" ? `${job.next.action}` : job.reason || "");
    return `<button class="card ${human ? "human" : ""}" data-id="${esc(job.id)}">
      <div class="id">${esc(job.id)}${job.round ? ` · round ${esc(job.round)}` : ""}</div>
      <div class="title">${esc(job.title || job.id)}</div>
      ${rounds(job)}
      <div class="reason">${esc(why)}</div></button>`;
  }

  function render() {
    const jobs = board.jobs || [];
    const human = jobs.filter((j) => j.stage === "needs-human");
    $("attention").innerHTML = human.length
      ? `<div class="lane"><h2><span>Needs a human</span><span>${human.length}</span></h2>${human.map(card).join("")}</div>` : "";
    $("lanes").innerHTML = LANES.map(([label, stages]) => {
      const items = jobs.filter((j) => stages.includes(j.stage));
      return `<section class="lane"><h2><span>${label}</span><span>${items.length}</span></h2>
        ${items.length ? items.map(card).join("") : `<div class="empty">—</div>`}</section>`;
    }).join("");
    const when = board.updated_at ? new Date(board.updated_at).toLocaleTimeString() : "never";
    $("meta").innerHTML = `${esc(board.target || "")} · ${esc(board.merge_mode || "")} · updated ${esc(when)}`
      + (board.stopping ? ` · <span class="stopping">stopping after the current job</span>` : "")
      + (board.note ? ` · ${esc(board.note)}` : "");
    document.querySelectorAll(".card").forEach((el) => el.addEventListener("click", () => open(el.dataset.id)));
  }

  function markdown(src) {
    const lines = esc(src).split("\n"); const out = []; let list = false, code = false, table = false;
    const inline = (s) => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    const close = () => { if (list) { out.push("</ul>"); list = false; } if (table) { out.push("</table>"); table = false; } };
    for (const line of lines) {
      if (line.startsWith("```")) { close(); out.push(code ? "</code></pre>" : "<pre><code>"); code = !code; continue; }
      if (code) { out.push(line); continue; }
      const h = line.match(/^(#{1,4})\s+(.*)$/);
      if (h) { close(); out.push(`<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`); continue; }
      if (/^\s*[-*]\s+/.test(line) || /^\s*\d+\.\s+/.test(line)) {
        if (!list) { close(); out.push("<ul>"); list = true; }
        out.push(`<li>${inline(line.replace(/^\s*([-*]|\d+\.)\s+/, ""))}</li>`); continue;
      }
      if (/^\|.*\|$/.test(line.trim())) {
        if (/^\|[\s|:-]+\|$/.test(line.trim())) continue;
        if (!table) { close(); out.push("<table>"); table = true; }
        out.push(`<tr>${line.trim().slice(1, -1).split("|").map((c) => `<td>${inline(c.trim())}</td>`).join("")}</tr>`); continue;
      }
      close();
      out.push(line.trim() ? `<p>${inline(line)}</p>` : "");
    }
    close(); if (code) out.push("</code></pre>");
    return out.join("\n");
  }

  async function show(job, path) {
    document.querySelectorAll("#dlg-files button").forEach((b) => b.setAttribute("aria-current", String(b.dataset.path === path)));
    try {
      const text = await (await api(`/file?job=${encodeURIComponent(job.id)}&path=${encodeURIComponent(path)}`)).text();
      $("dlg-doc").innerHTML = markdown(text);
    } catch (e) { $("dlg-doc").innerHTML = `<p class="error">${esc(e.message)}</p>`; }
  }

  function actions(job) {
    const acts = [];
    if (job.stage === "needs-human") acts.push(["approve", "Approve", "primary"]);
    if (job.stage === "needs-human" || job.stage === "pr-open") acts.push(["rework", "Rework", ""]);
    if (!["done", "merged", "cancelled"].includes(job.stage)) acts.push(["cancel", "Cancel job", "danger"]);
    if (!acts.length) return "";
    return `<textarea id="act-text" aria-label="Note for rework, or reason for cancel" placeholder="Rework note, or reason for cancelling"></textarea>`
      + acts.map(([cmd, label, cls]) => `<button class="btn ${cls}" data-cmd="${cmd}">${label}</button>`).join("")
      + `<span class="note" id="act-status" role="status"></span>`;
  }

  function lockButtons() {
    document.querySelectorAll("#dlg-acts button[data-cmd]").forEach((b) => { b.disabled = sending || pending; });
  }

  const STATE_TEXT = { queued: "Queued", applied: "Applied", refused: "Refused" };
  function commandLine(c) {
    const when = new Date(c.done_at || c.at).toLocaleTimeString();
    const detail = c.status === "queued" ? "waiting for the orchestrator" : c.outcome || "";
    return `<div class="cmd"><span class="state ${esc(c.status)}">${esc(STATE_TEXT[c.status] || c.status)}</span>`
      + `<span>${esc(c.command)} · ${esc(when)}${detail ? ` — ${esc(detail)}` : ""}</span></div>`;
  }

  async function loadCommands(id) {
    try {
      const { commands } = await (await api(`/commands?job=${encodeURIComponent(id)}`)).json();
      if (openJob !== id) return;
      pending = commands.some((c) => c.status === "queued");
      $("dlg-cmds").innerHTML = commands.slice().reverse().map(commandLine).join("");
      lockButtons();
    } catch (e) { /* the next refresh tries again */ }
  }

  async function send(job, command) {
    if (sending || pending) return;
    const text = ($("act-text") || {}).value || "";
    if (command === "rework" && !text.trim()) { $("act-status").textContent = "Rework needs a note."; return; }
    if (command === "cancel" && !confirm(`Cancel ${job.id}? This closes its PR and deletes its branch.`)) return;
    sending = true; lockButtons();
    $("act-status").textContent = `Sending ${command}…`;
    try {
      await api("/command", { method: "POST", headers: { "Content-Type": "application/json" },
                              body: JSON.stringify({ command, job: job.id, text, by: "dashboard" }) });
      $("act-status").textContent = "";
      pending = true;
    } catch (e) { $("act-status").textContent = e.message; }
    sending = false;
    await loadCommands(job.id);
  }

  function fillHeader(job) {
    $("dlg-id").textContent = `${job.id} · ${job.stage}`;
    $("dlg-title").textContent = job.title || job.id;
    $("dlg-reason").textContent = job.reason || "";
  }

  function fillFiles(job) {
    const files = job.files || [];
    openFiles = files.join("\n");
    const current = document.querySelector('#dlg-files button[aria-current="true"]');
    $("dlg-files").innerHTML = files.map((f) => `<button data-path="${esc(f)}">${esc(f)}</button>`).join("") || `<div class="empty">No files yet</div>`;
    $("dlg-files").querySelectorAll("button").forEach((b) => {
      b.setAttribute("aria-current", String(!!current && b.dataset.path === current.dataset.path));
      b.addEventListener("click", () => show(job, b.dataset.path));
    });
  }

  function fillActions(job) {
    openStage = job.stage;
    $("dlg-acts").innerHTML = actions(job);
    $("dlg-acts").querySelectorAll("button[data-cmd]").forEach((b) => b.addEventListener("click", () => send(job, b.dataset.cmd)));
    lockButtons();
  }

  function open(id) {
    const job = (board.jobs || []).find((j) => j.id === id); if (!job) return;
    openJob = id; pending = false; sending = false;
    fillHeader(job);
    $("dlg-doc").innerHTML = "";
    $("dlg-cmds").innerHTML = "";
    fillFiles(job);
    fillActions(job);
    const files = job.files || [];
    const first = ["decision.md", "spec.md"].find((f) => files.includes(f)) || files[0];
    if (first) show(job, first);
    if (!$("dlg").open) $("dlg").showModal();
    loadCommands(id);
  }

  // The open dialog follows the board: header always, files and actions only when they changed, so a
  // half-written rework note survives every refresh that doesn't move the job.
  function followOpen() {
    const job = (board.jobs || []).find((j) => j.id === openJob); if (!job) return;
    fillHeader(job);
    if ((job.files || []).join("\n") !== openFiles) fillFiles(job);
    if (job.stage !== openStage) fillActions(job);
    loadCommands(job.id);
  }

  $("dlg-close").addEventListener("click", () => $("dlg").close());
  $("dlg").addEventListener("close", () => { openJob = null; });

  async function refresh() {
    try {
      board = await (await api("/board.json")).json();
      render();
      if (openJob) followOpen();
    } catch (e) {
      $("meta").innerHTML = `<span class="error">${esc(e.message)}</span>`;
    }
  }
  if (!token) { $("meta").innerHTML = `<span class="error">Open the URL the server printed; it carries the token.</span>`; return; }
  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
