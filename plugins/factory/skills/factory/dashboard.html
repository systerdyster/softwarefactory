<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Quest</title>
<style>
  :root {
    --bg: #2e2019; --plank: #3a2416; --plank-2: #33200f; --seam: #1a0f08; --cork: #8a5a35;
    --ink: #5b2a12; --muted: #8a5a35; --line: #5b2a12; --page-ink: #fbe2b0;
    --paper: #fbe2b0; --paper-2: #f3cc8a; --paper-edge: #c9955a; --wood: #b5652a; --wood-light: #e3a058; --wood-dark: #5b2a12;
    --frame: #6e3c1c; --you: #c4471f; --bad: #b02a2a; --good: #3f7a2c; --focus: #ffd75e; --win-shade: #d9a868;
    --font: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--page-ink); font: 13px/1.5 var(--font);
         background: radial-gradient(ellipse 60% 40% at 50% 0%, rgb(255 190 90 / .16), transparent 70%),
                     repeating-linear-gradient(0deg, var(--plank) 0 46px, var(--plank-2) 46px 92px), var(--bg); }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .7;
                 background: repeating-linear-gradient(0deg, transparent 0 45px, var(--seam) 45px 46px); }
  body.night::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 5;
                      background: radial-gradient(ellipse 70% 55% at 50% 45%, transparent 40%, rgb(8 4 2 / .45)); }
  img.ptxt, img.px, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  img.ptxt, img.px { display: block; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .warn { color: var(--you); }

  /* The tavern wall: the sign, and a window onto the sky. */
  .wall { position: relative; display: flex; gap: 24px; align-items: center; margin: 18px 16px 0; }
  @media (max-width: 900px) { .wall { flex-direction: column; align-items: stretch; } }
  header.sign { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 10px 18px;
                max-width: 100%; flex: 0 1 auto; background: linear-gradient(#7a4421, #5e3317);
                border: 3px solid var(--wood-dark); border-radius: 4px; box-shadow: inset 0 0 0 2px #9a5a2c, 0 6px 0 rgb(0 0 0 / .35); }
  header.sign h1 { display: grid; gap: 6px; margin: 0; }
  header.sign .meta { color: #d9b98a; font-size: 12px; overflow-wrap: anywhere; flex: 1 1 260px; }
  header.sign .warn { color: var(--focus); }
  .window { position: relative; flex: 1 1 320px; height: 124px; border: 10px solid var(--frame); outline: 3px solid var(--wood-dark);
            box-shadow: inset 0 0 0 3px var(--wood-dark), 0 6px 0 rgb(0 0 0 / .35); background: #000; }
  .window canvas { display: block; width: 100%; height: 100%; }
  .window::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, transparent calc(33.3% - 3px), var(--frame) calc(33.3% - 3px) calc(33.3% + 3px), transparent calc(33.3% + 3px),
                                transparent calc(66.6% - 3px), var(--frame) calc(66.6% - 3px) calc(66.6% + 3px), transparent calc(66.6% + 3px)),
                linear-gradient(transparent calc(50% - 2px), var(--frame) calc(50% - 2px) calc(50% + 2px), transparent calc(50% + 2px)); }
  .window .sill { position: absolute; left: -16px; right: -16px; bottom: -20px; height: 10px; background: #8a4e26; border: 2px solid var(--wood-dark); }
  .window.winter .sill { border-top: 5px solid #eef3f6; }

  /* The board: five columns in the order a quest runs. */
  main { position: relative; padding: 18px 16px 40px; }
  .board { padding: 14px; border: 10px solid var(--wood); border-radius: 4px; outline: 3px solid var(--wood-dark); overflow-x: auto;
           box-shadow: inset 0 0 0 3px var(--wood-dark), 0 8px 0 rgb(0 0 0 / .35);
           background: radial-gradient(circle at 20% 30%, rgb(0 0 0 / .08) 1px, transparent 2px) 0 0 / 9px 9px,
                       radial-gradient(circle at 70% 60%, rgb(255 255 255 / .05) 1px, transparent 2px) 0 0 / 7px 7px, var(--cork); }
  .lanes { display: grid; align-items: stretch;
           grid-template-columns: minmax(180px, 1fr) repeat(2, minmax(200px, 1.1fr)) minmax(240px, 1.4fr) minmax(180px, 1fr); }
  .lane { display: grid; gap: 14px; align-content: start; min-width: 0; padding: 0 10px; }
  .lane + .lane { border-left: 2px dashed rgb(59 30 12 / .45); }
  .lane.side { background: rgb(0 0 0 / .1); }
  .lane h2 { position: relative; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin: 0 0 2px;
             padding: 8px 30px 7px 10px; background: var(--wood-dark); border: 2px solid #3a1a08; box-shadow: inset 0 0 0 2px #7a3e1a; }
  .lane h2 img.ptxt { max-width: 100%; height: auto; }
  .lane h2 .count { position: absolute; top: -9px; right: -7px; padding: 3px 5px; background: var(--focus);
                    border: 2px solid #3a1a08; border-radius: 3px; box-shadow: 2px 2px 0 rgb(0 0 0 / .35); }
  .lane h2 .sub { flex-basis: 100%; font: 400 10.5px var(--font); color: #f0c98a; }
  .lane-empty { margin: 0; padding: 8px; font-size: 12px; color: #e9c896; opacity: .7; text-align: center; }

  /* A job is a note pinned to the board; a stamp marks it approved, merged or cancelled. */
  .paper { position: relative; min-width: 0; color: var(--ink); background: var(--paper); padding: 16px 10px 10px;
           border: 2px solid var(--paper-edge); box-shadow: 3px 4px 0 rgb(0 0 0 / .3), inset 0 -8px 0 var(--paper-2); }
  .paper.pinned { transform: rotate(var(--tilt, 0deg)); }
  .paper.pinned::before { content: ""; position: absolute; top: 4px; left: 50%; width: 9px; height: 9px; margin-left: -4px;
                          background: #9c9c9c; border: 2px solid #3a3a3a; box-shadow: inset -2px -2px 0 #6a6a6a; }
  .paper.you { border-color: #e2a62a; box-shadow: 0 0 0 3px var(--focus), 3px 4px 0 rgb(0 0 0 / .3), inset 0 -8px 0 var(--paper-2); }
  .paper.you::before { background: #e05030; border-color: #5b1a0a; box-shadow: inset -2px -2px 0 #9a2a14; }
  .paper.bad { border-color: var(--bad); box-shadow: 0 0 0 3px #e9786a, 3px 4px 0 rgb(0 0 0 / .3), inset 0 -8px 0 var(--paper-2); }
  .job { display: grid; gap: 4px; cursor: pointer; }
  .job-head { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
  .job .title { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font-weight: 700; font-size: 12.5px;
                line-height: 1.35; overflow-wrap: break-word; min-width: 0; }
  .job:hover .title, .job:focus-within .title { text-decoration: underline; }
  .job .line { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; min-width: 0; }
  .job .line img.ptxt { max-width: 100%; height: auto; }
  .job .time { color: var(--muted); font-size: 11.5px; }
  .job .crew { display: flex; flex-wrap: wrap; gap: 0 8px; font-size: 11px; color: var(--muted); }
  .job .crew .PASS { color: var(--good); } .job .crew .CHANGES { color: var(--bad); } .job .crew .running { color: var(--ink); font-weight: 700; }
  .job .reason, .job .mood { margin: 0; font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
  .job.you .reason { color: var(--you); } .job.bad .reason { color: var(--bad); }
  .stamp { position: absolute; right: 10px; bottom: 10px; padding: 2px 6px; transform: rotate(-10deg); pointer-events: none;
           font: 700 12px/1 var(--font); letter-spacing: 1px; color: #c0281c; border: 3px solid #c0281c; border-radius: 3px;
           opacity: .85; mix-blend-mode: multiply; }
  .stamp.good { color: #2f7a24; border-color: #2f7a24; transform: rotate(-8deg); }
  .paper.stamped { padding-bottom: 40px; }
  .pile .paper + .paper { margin-top: -10px; }

  /* The party on a card: who works now beside the status, the whole party in a row once it is back. */
  .job.beside { grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; }
  .job.beside > * { grid-column: 1 / -1; }
  .job .meta-col { display: grid; gap: 2px; min-width: 0; }
  .job.beside > .meta-col { grid-column: 1; grid-row: 3; align-self: end; }
  .job.beside > .party { grid-column: 2; grid-row: 3; margin: 0; padding-top: 20px; border: 0; }
  .party { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0 4px; margin: 6px 0 4px; padding: 22px 0 3px;
           border-bottom: 3px solid var(--paper-edge); }
  .fig { position: relative; flex: none; }
  .fig.busy img { animation: bob .7s steps(2) infinite; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .fig.busy img { animation: none; } }
  .fig .bubble { position: absolute; top: -21px; left: 50%; transform: translateX(-50%); z-index: 1; padding: 3px 4px 2px;
                 font: 700 12px/1 var(--font); background: #fff; color: var(--ink); border: 2px solid var(--ink); border-radius: 3px; }

  /* The hall of fame: finished quests in a pile per month on the table below the board. */
  .hall { margin-top: 22px; padding: 14px 18px 22px; background: linear-gradient(#6e3c1c, #552c13);
          border-top: 6px solid #8a4e26; box-shadow: 0 8px 0 rgb(0 0 0 / .35), inset 0 6px 0 rgb(0 0 0 / .15); }
  .hall h2 { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; margin: 0 0 16px; }
  .hall h2 .sub { font: 400 11px var(--font); color: #f0c98a; }
  .stacks { display: flex; flex-wrap: wrap; gap: 26px 34px; align-items: flex-start; }
  .month { display: grid; gap: 8px; }
  .month > button { justify-self: start; padding: 0; border: 0; background: none; cursor: pointer; }
  .month .stack { position: relative; width: 200px; text-align: left; }
  .month .stack .under { position: absolute; inset: 0; background: var(--paper-2); border: 2px solid var(--paper-edge);
                         transform: translate(var(--dx), var(--dy)) rotate(var(--r)); }
  .month .stack .paper { transform: rotate(var(--r)); }
  .month .stack:hover .paper { transform: rotate(var(--r)) translateY(-3px); }
  .month .spread { display: flex; flex-wrap: wrap; gap: 14px; max-width: 880px; }
  .month .spread .paper { width: 200px; transform: rotate(var(--r)); }
  .empty { color: #e9c896; opacity: .7; margin: 0; }

  dialog { width: min(880px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; color: var(--ink);
           border: 4px solid var(--wood); border-radius: 6px; outline: 3px solid var(--wood-dark);
           background: var(--paper); box-shadow: inset 0 0 0 2px var(--wood-light); }
  dialog::backdrop { background: rgb(0 0 0 / .6); }
  .dlg-head { display: flex; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 2px solid var(--win-shade); }
  .dlg-head h2 { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
  .dlg-body { display: grid; grid-template-columns: 190px 1fr; min-height: 300px; }
  @media (max-width: 640px) { .dlg-body { grid-template-columns: 1fr; } }
  .files { border-right: 2px solid var(--win-shade); padding: 8px; overflow: auto; max-height: 65vh; }
  .files button { display: block; width: 100%; text-align: left; border: 0; background: none; font-size: 12px;
                  padding: 4px 6px 4px 16px; cursor: pointer; overflow-wrap: anywhere; position: relative; }
  .files button[aria-current="true"]::before, .files button:hover::before { content: "▶"; position: absolute; left: 2px; color: var(--you); }
  .files button[aria-current="true"] { font-weight: 700; }
  .doc { padding: 12px 18px; overflow: auto; max-height: 65vh; min-width: 0; }
  .doc pre { background: var(--paper-2); padding: 10px; overflow: auto; }
  .doc code { font: 12px var(--font); }
  .doc table { border-collapse: collapse; } .doc td, .doc th { border: 1px solid var(--win-shade); padding: 3px 8px; }
  .story-wrap:empty { display: none; }
  .story { margin: 0; padding: 10px 16px 10px 34px; border-bottom: 2px solid var(--win-shade); font-size: 12px;
           color: var(--muted); display: grid; gap: 2px; }
  .story li { overflow-wrap: anywhere; }
  .acts { padding: 12px 16px; border-bottom: 2px solid var(--win-shade); max-height: 55vh; overflow: auto; }
  .acts:empty { display: none; }
  .acts h3 { margin: 0 0 6px; font-size: 14px; color: var(--you); }
  .acts .q { margin: 0 0 6px; font-weight: 700; overflow-wrap: anywhere; }
  .acts .ctx { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .acts .ctx p { margin: 0 0 6px; }
  .acts .lead { margin: 10px 0 4px; font-weight: 700; }
  .acts .least { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
  .acts .warn { color: var(--bad); }
  .opts { border: 0; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
  .opt { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 2px solid var(--win-shade);
         cursor: pointer; overflow-wrap: anywhere; }
  .opt:has(input:checked) { border-color: var(--you); }
  .opt input { margin-top: 3px; accent-color: var(--you); }
  .rec { font-size: 11px; padding: 0 6px; background: var(--good); color: var(--paper); }
  .acts textarea { display: block; width: 100%; min-height: 38px; margin-top: 8px; font: inherit; padding: 6px 8px;
                   border: 2px solid var(--wood); background: #fff3d6; color: inherit; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .btn { padding: 6px 12px; border: 3px solid var(--wood-dark); border-radius: 4px; background: var(--wood-light);
         box-shadow: inset 0 -3px 0 var(--wood); color: var(--wood-dark); font-weight: 700; cursor: pointer; }
  .btn:hover:not(:disabled) { background: #f0b46a; }
  .btn.primary { background: #7cc34a; box-shadow: inset 0 -3px 0 #4f8a2c; }
  .btn.primary:hover:not(:disabled) { background: #8ed45a; }
  .btn.danger { color: var(--bad); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .cmds { display: grid; gap: 4px; padding: 8px 16px; font-size: 12px; border-bottom: 2px solid var(--win-shade); }
  .cmds:empty { display: none; }
  .cmd { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; overflow-wrap: anywhere; }
  .cmd .state { font-size: 11px; font-weight: 700; padding: 0 6px; }
  .cmd .state.queued { background: var(--win-shade); }
  .cmd .state.applied { background: var(--good); color: var(--paper); }
  .cmd .state.refused { background: var(--bad); color: var(--paper); }
  .note { font-size: 12px; color: var(--muted); }
  .error { color: var(--bad); padding: 16px; }
</style>
</head>
<body>
<div class="wall">
  <header class="sign">
    <h1 id="title"></h1>
    <span class="meta" id="meta">Loading…</span>
  </header>
  <div class="window" id="window"><canvas id="sky" role="img" aria-label="The sky outside, by the time of day and the season"></canvas><span class="sill"></span></div>
</div>
<main>
  <section class="board" aria-label="Jobs in the order a quest runs">
    <div class="lanes" id="cards"></div>
  </section>
  <section class="hall" id="hall" aria-label="Finished jobs by month"></section>
</main>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-head">
    <div><div class="note" id="dlg-id"></div><h2 id="dlg-title"></h2><div class="note" id="dlg-reason"></div></div>
    <button class="btn" id="dlg-close" aria-label="Close">Close</button>
  </div>
  <section class="story-wrap" id="dlg-story" aria-label="What has happened"></section>
  <section class="acts" id="dlg-acts"></section>
  <div class="cmds" id="dlg-cmds" role="status" aria-live="polite" aria-label="Commands for this job"></div>
  <div class="dlg-body">
    <nav class="files" id="dlg-files" aria-label="Job files"></nav>
    <article class="doc" id="dlg-doc"></article>
  </div>
</dialog>

<script>
const Gfx = (() => {
  function canvas(w, h) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    return c;
  }

  function rnd(seed) {
    return () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  return { canvas, rnd };
})();

  const AT = {

  };
  const pictures = {};

  // Mud lands on the lower body and in flecks on the rest; the outline stays as it is.
  function muddy(ctx, w, h, seed) {
    const img = ctx.getImageData(0, 0, w, h), d = img.data, r = Gfx.rnd(seed);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4, roll = r();
      if (!d[i + 3] || d[i] + d[i + 1] + d[i + 2] < 40) continue;
      const mud = y / h > .55 ? (roll < .6 ? .75 : .4) : (roll < .22 ? .65 : .18);
      d[i] += (92 - d[i]) * mud; d[i + 1] += (64 - d[i + 1]) * mud; d[i + 2] += (36 - d[i + 2]) * mud;
    }
    ctx.putImageData(img, 0, 0);
  }

  const ready = new Promise((resolve) => {
    const sheet = new Image();
    sheet.onload = () => {
      Object.entries(AT).forEach(([name, [x, y, w, h]], n) => {
        const c = Gfx.canvas(w, h), ctx = c.getContext("2d");
        ctx.drawImage(sheet, x, y, w, h, 0, 0, w, h);

        muddy(ctx, w, h, n + 1);
        pictures[name] = { w, h, clean, muddy: c.toDataURL() };

      resolve();
    };
    sheet.onerror = () => resolve();
    sheet.src = SHEET;
  });

  return { ready, names: Object.keys(AT), picture: (name, dirty) => pictures[name] && { ...pictures[name], url: pictures[name][dirty ? "muddy" : "clean"] } };
})();

// The view through the tavern window: the sky by the local clock — day, dusk or night — and the
// season by the month, in the hills, a branch at the corner, what falls past, and snow on the sill.
const Sky = (() => {
  const SEASONS = ["winter", "winter", "spring", "spring", "spring", "summer", "summer", "summer", "autumn", "autumn", "autumn", "winter"];
  const BANDS = {
    day: ["#4f9fe0", "#62b0ea", "#78c0f0", "#92d0f4"], winterDay: ["#7fa6c8", "#93b6d4", "#a8c6de", "#bed6ea"],
    dusk: ["#2a2a5a", "#8a6ab0", "#e08aa0", "#f4b88a"], night: ["#121228", "#141a36", "#1a2448", "#1e2a52"],
  };
  const CLOUD = { day: ["#ffffff", "#cfe4f4"], dusk: ["#f4c0a0", "#e08aa0"], night: ["#5a5a8a", "#3e3e6a"] };
  const HILLS = { spring: ["#5c9e4a", "#4a8a3c"], summer: ["#4f9440", "#3e7a32"], autumn: ["#b08a42", "#8f6a2e"], winter: ["#dfe8ef", "#c2d0dc"] };
  const LEAVES = { spring: ["#7cc35a", "#f4a8c0"], summer: ["#4a8a3c", "#5ca545"], autumn: ["#c4471f", "#e8a030"], winter: ["#8a5a34", "#8a5a34"] };
  const FALL = { winter: ["#ffffff", "#e4ecf4"], spring: ["#f4a8c0", "#ffffff"], autumn: ["#c4471f", "#e8a030"], summer: null };
  const SHADE = { day: 0, dusk: .25, night: .55 };

  function at(date) {
    const hour = date.getHours() + date.getMinutes() / 60, season = SEASONS[date.getMonth()];
    const time = hour >= 8 && hour < 17 ? "day" : (hour >= 6 && hour < 8) || (hour >= 17 && hour < 19.5) ? "dusk" : "night";
    return { hour, season, time };
  }

  function dim(hex, k) {
    const n = parseInt(hex.slice(1), 16), f = (c) => Math.round(c * (1 - k) + 16 * k);
    return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
  }

  function start(canvas, still) {
    let W = 0, H = 0, stars, clouds, ridge, flakes, now = at(new Date());
    const g = canvas.getContext("2d");
    function fit() {
      W = Math.max(120, Math.round(canvas.clientWidth / 3)); H = Math.max(20, Math.round(canvas.clientHeight / 3));
      canvas.width = W; canvas.height = H;
      const r = Gfx.rnd(7);
      stars = Array.from({ length: 50 }, () => [Math.floor(r() * W), Math.floor(r() * H * .6)]);
      clouds = Array.from({ length: 5 }, (_, i) => ({ x: i * W / 4 + r() * 30, y: 6 + r() * 10, w: 16 + r() * 14 }));
      ridge = Array.from({ length: W }, (_, x) => Math.round(H * .72 - 6 * Math.sin(x / 23) - 4 * Math.sin(x / 9 + 1)));
      flakes = Array.from({ length: 40 }, () => ({ x: r() * W, y: r() * H, v: .15 + r() * .25, c: r() < .5 ? 0 : 1 }));
    }
    function frame(t) {
      const { hour, season, time } = now, shade = SHADE[time];
      const bands = time === "day" && season === "winter" ? BANDS.winterDay : BANDS[time];
      bands.forEach((c, i) => { g.fillStyle = c; g.fillRect(0, Math.floor(i * H / 4), W, Math.ceil(H / 4)); });
      if (time === "night") stars.forEach(([x, y], i) => { g.fillStyle = (Math.floor(t / 700) + i) % 9 ? "#ffffff" : "#8a8ab0"; g.fillRect(x, y, 1, 1); });
      const day = hour >= 6 && hour < 19.5, k = day ? (hour - 6) / 13.5 : ((hour + 4.5) % 24) / 10.5;
      const sx = Math.round(W * (.08 + .84 * k)), sy = Math.round(H * .62 - Math.sin(k * Math.PI) * H * .45);
      g.fillStyle = day ? "#ffe066" : "#f4f4ff";
      g.fillRect(sx - 3, sy - 4, 6, 8); g.fillRect(sx - 4, sy - 3, 8, 6);
      if (!day) { g.fillStyle = bands[0]; g.fillRect(sx - 1, sy - 4, 5, 6); }
      clouds.forEach((c) => {
        const x = Math.round(((c.x + t / 900) % (W + 40)) - 20);
        g.fillStyle = CLOUD[time][1]; g.fillRect(x, c.y + 3, c.w, 3);
        g.fillStyle = CLOUD[time][0]; g.fillRect(x + 2, c.y, c.w - 4, 4); g.fillRect(x + 5, c.y - 2, c.w / 2, 2);
      });
      ridge.forEach((y, x) => {
        g.fillStyle = dim(HILLS[season][0], shade); g.fillRect(x, y, 1, H - y);
        g.fillStyle = dim(HILLS[season][1], shade); g.fillRect(x, y + 6 + Math.round(2 * Math.sin(x / 13)), 1, H);
      });
      g.fillStyle = dim("#5b3a1e", shade); g.fillRect(W - 30, 3, 30, 2); g.fillRect(W - 14, 0, 2, 6);
      for (let i = 0; i < 26; i++) { g.fillStyle = dim(LEAVES[season][i % 2], shade); g.fillRect(W - 24 + (i * 37) % 22, (i * 13) % 14, 3, 2); }
      if (season === "winter") { g.fillStyle = dim("#ffffff", shade * .6); g.fillRect(W - 30, 2, 30, 1); }
      if (FALL[season]) flakes.forEach((f) => {
        const y = (f.y + t / 50 * f.v) % H, x = (f.x + Math.sin(t / 900 + f.y) * 3 + W) % W;
        g.fillStyle = dim(FALL[season][f.c], shade * .5); g.fillRect(Math.round(x), Math.round(y), season === "winter" ? 1 : 2, 1);
      });
      if (time !== "day") { g.fillStyle = `rgba(10,10,40,${shade * .35})`; g.fillRect(0, 0, W, H); }
      if (!still) requestAnimationFrame(frame);
    }
    function tell() {
      now = at(new Date());
      canvas.parentElement.className = `window ${now.season} ${now.time}`;
      document.body.classList.toggle("night", now.time === "night");
    }
    fit(); tell();
    new ResizeObserver(() => { fit(); if (still) frame(0); }).observe(canvas);
    setInterval(() => { tell(); if (still) frame(0); }, 60000);
    frame(0);
  }

  return { start };
})();

    Y: "10001 10001 01010 00100 00100 00100 00100", Z: "11111 00001 00010 00100 01000 10000 11111",
    0: "01110 10001 10011 10101 11001 10001 01110", 1: "00100 01100 00100 00100 00100 00100 01110",
    2: "01110 10001 00001 00010 00100 01000 11111", 3: "11111 00010 00100 00010 00001 10001 01110",
    4: "00010 00110 01010 10010 11111 00010 00010", 5: "11111 10000 11110 00001 00001 10001 01110",
    6: "00110 01000 10000 11110 10001 10001 01110", 7: "11111 00001 00010 00100 01000 01000 01000",
    8: "01110 10001 10001 01110 10001 10001 01110", 9: "01110 10001 10001 01111 00001 00010 01100",
    ".": "00000 00000 00000 00000 00000 01100 01100", ",": "00000 00000 00000 00000 01100 00100 01000",
    ":": "00000 01100 01100 00000 01100 01100 00000", "-": "00000 00000 00000 11111 00000 00000 00000",
    "!": "00100 00100 00100 00100 00100 00000 00100", "?": "01110 10001 00001 00010 00100 00000 00100",
    "/": "00001 00010 00010 00100 01000 01000 10000", "#": "01010 01010 11111 01010 11111 01010 01010",
    "(": "00010 00100 01000 01000 01000 00100 00010", ")": "01000 00100 00010 00010 00010 00100 01000",
    "'": "00100 00100 01000 00000 00000 00000 00000", "+": "00000 00100 00100 11111 00100 00100 00000",
    "·": "00000 00000 00000 01100 01100 00000 00000",
  };
  const images = new Map();

  function text(str, colour = "#5b2a12", scale = 2, shadow = "#f3cc8a") {
    const s = String(str).toUpperCase();
    const key = `${s}|${colour}|${scale}|${shadow}`;
    if (!images.has(key)) {
      const chars = [...s];
      const c = Gfx.canvas(chars.reduce((w, ch) => w + (ch === " " ? 4 : 6), 0) + 1, 8);
      const ctx = c.getContext("2d");
      let x = 0;
      for (const ch of chars) {
        if (ch === " ") { x += 4; continue; }
        const rows = (GLYPHS[ch] || GLYPHS["?"]).split(" ");
        for (const [fill, d] of [[shadow, 1], [colour, 0]]) {
          ctx.fillStyle = fill;
          rows.forEach((row, j) => [...row].forEach((bit, i) => { if (bit === "1") ctx.fillRect(x + i + d, j + d, 1, 1); }));
        }
        x += 6;
      }
      images.set(key, { url: c.toDataURL(), w: c.width, h: c.height });
    }
    const t = images.get(key);
    return `<img class="ptxt" src="${t.url}" width="${t.w * scale}" height="${t.h * scale}" alt="${s.replace(/"/g, "&quot;")}">`;
  }

  return { text };
})();

(() => {
  const params = new URLSearchParams(location.search);
  let token = params.get("token");
  try {
    if (token) { sessionStorage.setItem("factory-token", token); history.replaceState(null, "", "/"); }
    else token = sessionStorage.getItem("factory-token");
  } catch (e) { /* storage unavailable: keep the token in memory only */ }

  const FINISHED = ["merged", "done", "cancelled"];
  const JOB_COLOURS = ["#d9453b", "#5aa9e6", "#f2a23a", "#f08aa0", "#5cae45", "#e07a2e", "#9c8aa8", "#3a6fb5"];
  const STATUS_TEXT = { done: "done", active: "in progress", waiting: "waiting", blocked: "stopped",
                        skipped: "skipped", pending: "not started" };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const T = Font.text;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let board = { jobs: [] }, openJob = null, openStage = null, openFiles = "", sending = false, pending = false, given = null, drawn = "";
  const spread = new Set();

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { "X-Factory-Token": token || "", ...(opts.headers || {}) } });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    return res;
  }

  function ago(iso) {
    const min = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    return min < 60 ? `${min} min` : `${Math.floor(min / 60)} h ${min % 60} min`;
  }

  const numberOf = (id) => String(id).match(/^\d+/)?.[0] || String(id).slice(0, 3);
  const colourOf = (id) => JOB_COLOURS[(parseInt(numberOf(id), 10) || 0) % JOB_COLOURS.length];
  const current = (job) => (job.pipeline || []).find((s) => ["active", "waiting", "blocked"].includes(s.status)) || {};

  // The status line a job's note leads with, and how loudly: for you, stopped, or just working.
  function status(job) {
    const steps = job.pipeline || [];
    const cur = current(job);
    const d = job.decision || {};
    const reviewers = (steps.find((s) => s.key === "review") || {}).reviewers || [];
    const since = cur.since || reviewers.find((r) => r.since)?.since;
    if (job.stage === "unknown") return { text: "CAN'T READ", tone: "bad" };
    if (d.kind === "question") return { text: "A QUESTION FOR YOU", tone: "you" };
    if (d.kind === "stopped") return { text: "STOPPED", tone: "bad" };
    if (cur.key === "approve") return { text: "READY FOR YOU", tone: "you" };
    const detail = (cur.detail || "").toUpperCase();
    const text = { start: "MAKING CAMP", build: ["BUILDING", detail].filter(Boolean).join(" · "), verify: "VERIFYING",
                   tidy: "TIDYING", review: `REVIEWING ${reviewers.filter((r) => r.verdict).length}/${reviewers.length}`,
                   pr: { "pr-open": "PR OPEN", rebasing: "REBASING", merging: "MERGING" }[job.stage] || "OPENING PR" }[cur.key];
    return { text: text || job.stage.toUpperCase(), since };
  }

  function summary(job) {
    return (job.pipeline || []).map((st) => `${st.label}: ${STATUS_TEXT[st.status] || st.status}`
      + (st.reviewers || []).map((r) => `, ${r.name} ${r.status}`).join("")).join("; ");
  }

  // Who plays whom. The builder alternates by job number; a mage without a figure of its own takes the
  // next one from the bench, in the order the project lists its mages.
  const CAST = { tidy: "locke", wiki: "strago", herald: "mog", code: "terra", security: "celes", ux: "relm", codex: "gogo" };
  const BENCH = ["cyan", "shadow", "setzer", "gau", "umaro", "esper"];
  function figureOf(role, job) {
    if (role === "builder") return (parseInt(numberOf(job.id), 10) || 0) % 2 ? "edgar" : "sabin";
    if (CAST[role]) return CAST[role];
    const extra = (board.reviewers || []).filter((r) => !CAST[r]);
    return BENCH[Math.max(0, extra.indexOf(role)) % BENCH.length];
  }

  // Who a job's note shows: whoever works on it now, and the whole party — muddy — once it is back
  // for you. A question or a stop is the builder's, with the mark it raised.
  function crew(job) {
    const cur = current(job), d = job.decision || {};
    const running = (role) => (job.runs || []).some((r) => r.role === role && r.status === "running");
    if (d.kind === "question" || d.kind === "stopped") return [{ role: "builder", mark: d.kind === "question" ? "?" : "!" }];
    if (cur.key === "approve") {
      const tidied = ((job.pipeline || []).find((s) => s.key === "tidy") || {}).status === "done";
      const mages = [...new Set(Object.values(job.verdicts || {}).flatMap(Object.keys))].sort();
      return ["builder", ...(tidied ? ["tidy"] : []), ...mages, ...(d.wiki ? ["wiki"] : []), "herald"]
        .map((role) => ({ role, dirty: true, mark: role === "herald" ? "!" : null }));
    }
    if (["start", "build", "verify"].includes(cur.key)) return [{ role: "builder", busy: cur.key === "verify" || running("builder") }];
    if (cur.key === "tidy") return [{ role: "tidy", busy: running("tidy") }];
    if (cur.key === "review") {
      if (running("wiki")) return [{ role: "wiki", busy: true }];
      const reviewers = cur.reviewers || [];
      const busy = reviewers.filter((r) => r.status === "running");
      return (busy.length ? busy : reviewers.filter((r) => r.status === "waiting")).map((r) => ({ role: r.name, busy: r.status === "running" }));
    }
    return [];
  }

  function figure(member, job) {
    const p = Party.picture(figureOf(member.role, job), member.dirty);
    if (!p) return "";
    return `<span class="fig${member.busy ? " busy" : ""}" title="${esc(member.role)}">`
      + (member.mark ? `<span class="bubble">${esc(member.mark)}</span>` : "")
      + `<img class="px" src="${p.url}" width="${p.w * 2}" height="${p.h * 2}" alt=""></span>`;
  }

  const LANE_OF = { start: "forge", build: "forge", verify: "forge", tidy: "forge", review: "mages", approve: "tavern", pr: "pile" };
  const LANES = [
    { key: "queue", title: "QUEST BOARD", sub: "posted, waiting for a party", side: true },
    { key: "forge", title: "THE FORGE", sub: "build · verify · tidy" },
    { key: "mages", title: "THE MAGES", sub: "review · wiki" },
    { key: "tavern", title: "BACK AT THE TAVERN", sub: "turned in: needs you" },
    { key: "pile", title: "APPROVED PILE", sub: "pr · rebase · merge", side: true },
  ];
  const laneOf = (job) => job.stage === "queued" ? "queue" : FINISHED.includes(job.stage) ? null : LANE_OF[current(job).key] || "forge";
  const tilt = (job) => [-0.8, 0.6, -0.4, 0.9][(parseInt(numberOf(job.id), 10) || 0) % 4];
  const head = (job, inert) => `<div class="job-head">${T(numberOf(job.id), colourOf(job.id), 2)}`
    + (inert ? `<span class="title">${esc(job.title || job.id)}</span></div>`
             : `<button class="title" data-open="${esc(job.id)}">${esc(job.title || job.id)}</button></div>`);

  function note(job) {
    const s = status(job), members = crew(job);
    const tone = { you: "#c4471f", bad: "#b02a2a" }[s.tone] || "#5b2a12";
    const reviewers = ((job.pipeline || []).find((st) => st.key === "review") || {}).reviewers || [];
    const showCrew = ["REVIEWING", "STOPPED", "READY"].some((w) => s.text.startsWith(w)) && reviewers.length;
    const mark = { PASS: "✓", CHANGES: "✗", running: "…", waiting: "·" };
    const beside = members.length && members.length < 3 && !members[0].dirty;
    const meta = (showCrew ? `<div class="crew">${reviewers.map((r) => `<span class="${esc(r.status)}">${esc(r.name)} ${mark[r.status] || ""}</span>`).join("")}</div>` : "")
      + (job.confidence == null ? "" : `<p class="mood">confidence ${esc(job.confidence)}/10</p>`)
      + (job.reason ? `<p class="reason">${esc(job.reason)}</p>` : "");
    return `<article class="paper pinned job ${s.tone || ""}${beside ? " beside" : ""}" style="--tilt:${tilt(job)}deg" data-id="${esc(job.id)}">${head(job)}
      <div class="line">${T(s.text, tone, 2)}${job.round > 1 ? T(`R${job.round}`, "#8a5a35", 2) : ""}${s.since ? `<span class="time">${esc(ago(s.since))}</span>` : ""}</div>
      ${members.length ? `<div class="party">${members.map((m) => figure(m, job)).join("")}</div>` : ""}
      ${meta ? `<div class="meta-col">${meta}</div>` : ""}
      <p class="sr">${esc(summary(job))}</p></article>`;
  }

  // A short note for the queue and the approved pile: what it is, and what it waits for.
  function slip(job) {
    const s = status(job), d = job.decision || {};
    const line = job.stage === "queued" ? ((job.waits_for || []).length ? `after ${job.waits_for.join(", ")}` : "")
      : [s.text.toLowerCase(), job.confidence != null ? `confidence ${job.confidence}/10` : ""].filter(Boolean).join(" · ");
    const approved = job.stage !== "queued" && !d.kind;
    return `<article class="paper pinned job${s.tone ? ` ${s.tone}` : ""}${approved ? " stamped" : ""}" style="--tilt:${tilt(job)}deg" data-id="${esc(job.id)}">${head(job)}`
      + (line ? `<p class="reason">${esc(line)}</p>` : "") + (job.reason && d.kind ? `<p class="reason">${esc(job.reason)}</p>` : "")
      + (approved ? `<span class="stamp good">APPROVED</span>` : "") + `</article>`;
  }

  // The hall of fame: one pile per month, newest first; the six latest months each get a pile and
  // everything older shares one. A pile spreads out when clicked.
  const MONTHS_SHOWN = 6;
  function hall(finished) {
    const when = (j) => j.finished_at || j.queued_at || "";
    const months = new Map();
    for (const j of finished.slice().sort((a, b) => when(b).localeCompare(when(a)))) {
      let month = when(j) ? new Date(when(j)).toLocaleString("en", { month: "long", year: "numeric" }).toUpperCase() : "UNDATED";
      if (!months.has(month) && months.size >= MONTHS_SHOWN) month = "OLDER";
      months.set(month, [...(months.get(month) || []), j]);
    }
    const sheet = (j, r, inert) => {
      const day = when(j) ? when(j).slice(5, 10) : "";
      const cancelled = j.stage === "cancelled";
      const line = [cancelled ? "" : j.confidence != null ? `confidence ${j.confidence}/10` : "", day].filter(Boolean).join(" · ");
      const tag = inert ? "span" : "article";
      return `<${tag} class="paper job stamped" style="--r:${r}deg"${inert ? "" : ` data-id="${esc(j.id)}"`}>${head(j, inert)}`
        + (line ? `<span class="reason">${esc(line)}</span>` : "")
        + `<span class="stamp${cancelled ? "" : " good"}">${cancelled ? "CANCELLED" : "MERGED"}</span></${tag}>`;
    };
    const piles = [...months].map(([month, jobs], m) => {
      const open = spread.has(month);
      const label = `<button data-month="${esc(month)}" aria-expanded="${open}">${T(`${month} · ${jobs.length}`, "#f0c98a", 2, "#3a1a08")}</button>`;
      if (open) return `<div class="month">${label}<div class="spread">${jobs.map((j, k) => sheet(j, [-1, 0.8, -0.4, 1.2][k % 4])).join("")}</div></div>`;
      const under = jobs.slice(1, 4).map((_, k) => `<span class="under" style="--dx:${(k % 2 ? -1 : 1) * (3 + k * 2)}px;--dy:${(k + 1) * 4}px;--r:${(k % 2 ? -2 : 2.5) + m}deg"></span>`).join("");
      return `<div class="month">${label}<button class="stack" data-month="${esc(month)}" aria-expanded="false" aria-label="Spread out ${esc(month)}">`
        + `${under}${sheet(jobs[0], [-1.5, 1, -0.5][m % 3], true)}</button></div>`;
    }).join("");
    return `<h2>${T(`HALL OF FAME · ${finished.length}`, "#ffd75e", 2, "#5b2a12")}<span class="sub">finished quests, newest on top</span></h2>`
      + (piles ? `<div class="stacks">${piles}</div>` : `<p class="empty">Nothing finished yet.</p>`);
  }

  function renderPanel() {
    const jobs = board.jobs || [];
    const lanes = LANES.map((lane, i) => {
      const here = jobs.filter((j) => laneOf(j) === lane.key);
      const body = here.length ? here.map(lane.side ? slip : note).join("")
        : `<p class="lane-empty">${lane.key === "queue" && !jobs.length ? "No jobs yet. Queue one with /factory add." : "Nobody here."}</p>`;
      return `<section class="lane${lane.side ? " side" : ""}" aria-label="${lane.title.toLowerCase()}">`
        + `<h2>${T(`${i + 1} ${lane.title}`, "#fbe2b0", 2, "#3a1a08")}<span class="count">${T(here.length, "#5b2a12", 2, "#f0b84a")}</span>`
        + `<span class="sub">${lane.sub}</span></h2>`
        + (lane.key === "pile" ? `<div class="pile">${body}</div>` : body) + `</section>`;
    }).join("");
    const done = hall(jobs.filter((j) => FINISHED.includes(j.stage)));
    if (lanes + done === drawn) return;
    drawn = lanes + done;
    $("cards").innerHTML = lanes;
    $("hall").innerHTML = done;
    document.querySelectorAll("#cards [data-id], #hall .spread [data-id]").forEach((el) => el.addEventListener("click", (e) => { e.stopPropagation(); open(el.dataset.id); }));
    document.querySelectorAll("#hall [data-month]").forEach((el) => el.addEventListener("click", () => {
      const month = el.dataset.month;

    }));
  }

  function render() {
    renderPanel();
    const o = board.orchestrator || {};
    const gm = o.state === "running" ? "" : o.state === "stale"
      ? ` · <span class="warn">orchestrator silent for ${esc(ago(o.last_seen))} — it may have stopped; nothing is built until it runs</span>`
      : ` · <span class="warn">orchestrator not running — what you decide is kept, and built on at the next /factory run</span>`;
    const when = board.updated_at ? new Date(board.updated_at).toLocaleTimeString() : "never";
    $("meta").innerHTML = `${esc(board.target || "")} · ${esc(board.merge_mode || "")} · updated ${esc(when)}`
      + (board.stopping ? ` · <span class="warn">stopping after the current job</span>` : "") + gm
      + (board.stale ? ` · <span class="warn">showing the last saved board — ${esc(board.stale)}</span>` : "")
      + (board.note ? ` · ${esc(board.note)}` : "");
  }

  function markdown(src) {
    const lines = esc(src).split("\n"); const out = []; let list = false, code = false, table = false;
    const inline = (s) => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    const close = () => { if (list) { out.push("</ul>"); list = false; } if (table) { out.push("</table>"); table = false; } };
    for (const line of lines) {
      if (line.startsWith("```")) { close(); out.push(code ? "</code></pre>" : "<pre><code>"); code = !code; continue; }
      if (code) { out.push(line); continue; }
      const h = line.match(/^(#{1,4})\s+(.*)$/);
      if (h) { close(); out.push(`<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`); continue; }
      if (/^\s*[-*]\s+/.test(line) || /^\s*\d+\.\s+/.test(line)) {
        if (!list) { close(); out.push("<ul>"); list = true; }
        out.push(`<li>${inline(line.replace(/^\s*([-*]|\d+\.)\s+/, ""))}</li>`); continue;
      }
      if (/^\|.*\|$/.test(line.trim())) {
        if (/^\|[\s|:-]+\|$/.test(line.trim())) continue;
        if (!table) { close(); out.push("<table>"); table = true; }
        out.push(`<tr>${line.trim().slice(1, -1).split("|").map((c) => `<td>${inline(c.trim())}</td>`).join("")}</tr>`); continue;
      }
      close();
      out.push(line.trim() ? `<p>${inline(line)}</p>` : "");
    }
    close(); if (code) out.push("</code></pre>");
    return out.join("\n");
  }

  async function show(job, path) {
    document.querySelectorAll("#dlg-files button").forEach((b) => b.setAttribute("aria-current", String(b.dataset.path === path)));
    try {
      const text = await (await api(`/file?job=${encodeURIComponent(job.id)}&path=${encodeURIComponent(path)}`)).text();
      $("dlg-doc").innerHTML = markdown(text);
    } catch (e) { $("dlg-doc").innerHTML = `<p class="error">${esc(e.message)}</p>`; }
  }

  function story(job) {
    const lines = job.story || [];
    return lines.length ? `<ol class="story">${lines.map((l) => `<li>${esc(l)}</li>`).join("")}</ol>` : "";
  }

  function checksLine(c) {
    if (!c) return "";
    const over = c.diff_lines > c.max_diff ? ` <strong class="warn">over max_diff ${esc(c.max_diff)}</strong>` : "";
    return `<p class="note">${esc(c.diff_lines)} lines changed in ${esc(c.files)} files${over}`
      + `${(c.lockfiles || []).length ? ` · lockfiles: ${esc(c.lockfiles.join(", "))}` : ""}</p>`;
  }

  // What the wiki pass changed in the pages you approve with the change; nothing for a project without a wiki.
  function wikiPart(w) {
    if (!w) return "";
    if (!w.done) return `<p class="note">The wiki was not updated: the wiki agent did not finish.</p>`;
    const list = (items) => items.map((i) => `<li>${markdown(i).replace(/^<p>|<\/p>$/g, "")}</li>`).join("");
    return ((w.changed || []).length ? `<p class="lead">Wiki pages changed — you approve them with the change:</p><ul class="least">${list(w.changed)}</ul>`
             : `<p class="note">Wiki: nothing to document${w.nothing ? ` — ${esc(w.nothing)}` : ""}.</p>`)
      + ((w.wanted || []).length ? `<p class="lead">Wiki pages it thinks are missing:</p><ul class="least">${list(w.wanted)}</ul>` : "")
      + ((w.other || []).length ? `<p class="lead">Other wikis the change makes stale:</p><ul class="least">${list(w.other)}</ul>` : "");
  }

  // What the developer decides now, and only the buttons that answer it.
  function decision(job) {
    const d = job.decision;
    const cancel = ["done", "merged", "cancelled"].includes(job.stage) ? [] : [["cancel", "Cancel job", "danger"]];
    if (d && d.kind === "question") {
      const options = (d.options || []).map((o, i) =>
        `<label class="opt"><input type="radio" name="answer" value="(${esc(o.key)}) ${esc(o.text)}"${o.recommended || (!i && !d.options.some((x) => x.recommended)) ? " checked" : ""}>`
        + `<span><strong>(${esc(o.key)})</strong> ${esc(o.text)}${o.recommended ? ` <span class="rec">recommended</span>` : ""}</span></label>`).join("");
      return { html: `<h3>Your decision</h3>${d.question ? `<p class="q">${esc(d.question)}</p>` : ""}`
        + `<div class="ctx">${markdown(d.context || "")}</div>`
        + `<fieldset class="opts"><legend class="sr">Options</legend>${options}`
        + `<label class="opt"><input type="radio" name="answer" value=""${options ? "" : " checked"}><span>Your own answer</span></label>`
        + `<textarea id="act-text" aria-label="Your own answer" placeholder="Your own answer"></textarea></fieldset>`,
        acts: [["answer", "Answer and continue", "primary"], ...cancel] };
    }
    if (d && d.kind === "approve") {
      const least = (d.least_sure || []).map((l) => `<li>${markdown(l).replace(/^<p>|<\/p>$/g, "")}</li>`).join("");
      return { html: `<h3>Ready for your approval</h3>${d.summary ? `<div class="ctx">${markdown(d.summary)}</div>` : ""}`
        + checksLine(d.checks)
        + (job.confidence != null ? `<p class="note">The reviewer's confidence: ${esc(job.confidence)}/10</p>` : "")
        + (least ? `<p class="lead">Check before you approve — the reviewer is least sure of:</p><ol class="least">${least}</ol>`
                 : `<p class="note">The reviewer named nothing it is unsure of.</p>`)
        + ((d.unrendered || []).length ? `<p class="lead">Not looked at in a browser — check the change by eye:</p><ul class="least">`
            + d.unrendered.map((u) => `<li><strong>${esc(u.reviewer)}</strong> — ${esc(u.why)}</li>`).join("") + `</ul>` : "")
        + ((d.findings || []).length ? `<p class="lead">The reviewers left these for you:</p><ul class="least">`
            + d.findings.map((f) => `<li><strong>${esc(f.reviewer)}</strong> — ${markdown(f.text).replace(/^<p>|<\/p>$/g, "")}</li>`).join("") + `</ul>` : "")
        + ((d.exemptions || []).length ? `<p class="lead">Not covered by an automated test — check by hand:</p><ul class="least">`
            + d.exemptions.map((e) => `<li>${markdown(e).replace(/^<p>|<\/p>$/g, "")}</li>`).join("") + `</ul>` : "")
        + wikiPart(d.wiki)
        + `<p class="lead">Test note — posted with the PR, and handed to the project's hand-off handler. Empty posts nothing:</p>`
        + `<textarea id="act-note" aria-label="Test note" placeholder="No test note. Write one if someone other than you should check this.">${esc(d.test_note)}</textarea>`
        + `<textarea id="act-text" aria-label="Rework note" placeholder="Rework note — what to change"></textarea>`,
        acts: [...(d.publish === "both" ? [["approve", "Publish PR", "primary"], ["approve-auto", "Publish PR with autocomplete", ""]]
                 : d.publish === "auto" ? [["approve-auto", "Publish PR with autocomplete", "primary"]]
                 : d.publish === "merge" ? [["approve", "Merge", "primary"]]
                 : [["approve", "Approve", "primary"]]),
               ["rework", "Rework", ""], ...cancel] };
    }
    if (d && d.kind === "stopped") {
      return { html: `<h3>Stopped — needs you</h3><p class="q">${esc(d.reason)}</p>`
        + `<textarea id="act-text" aria-label="Rework note" placeholder="Rework note — what to do next"></textarea>`,
        acts: [["rework", "Rework", "primary"], ...cancel] };
    }
    const rework = job.stage === "pr-open" ? [["rework", "Rework", ""]] : [];
    if (!rework.length && !cancel.length) return { html: "", acts: [] };
    return { html: `<textarea id="act-text" aria-label="Rework note or reason for cancelling" placeholder="Rework note, or reason for cancelling"></textarea>`,
             acts: [...rework, ...cancel] };
  }

  function actions(job) {
    const { html, acts } = decision(job);
    return html + (acts.length ? `<div class="btns">${acts.map(([cmd, label, cls]) =>
      `<button class="btn ${cls}" data-cmd="${cmd}">${label}</button>`).join("")}<span class="note" id="act-status" role="status"></span></div>` : "");
  }

  function decisionKey(job) {
    const d = job.decision || {};
    return [job.stage, d.kind, d.question, d.context].join("|");
  }

  function lockButtons() {
    // A command already given for this decision keeps its buttons off until the board shows the job moved.
    document.querySelectorAll("#dlg-acts button[data-cmd]").forEach((b) => { b.disabled = sending || pending || given === openStage; });
  }

  const STATE_TEXT = { queued: "Queued", applied: "Applied", refused: "Refused" };
  function commandLine(c) {
    const when = new Date(c.done_at || c.at).toLocaleTimeString();
    const detail = c.status === "queued" ? "waiting for the orchestrator" : c.outcome || "";
    return `<div class="cmd"><span class="state ${esc(c.status)}">${esc(STATE_TEXT[c.status] || c.status)}</span>`
      + `<span>${esc(c.command)} · ${esc(when)}${detail ? ` — ${esc(detail)}` : ""}</span></div>`;
  }

  async function loadCommands(id) {
    try {
      const { commands } = await (await api(`/commands?job=${encodeURIComponent(id)}`)).json();
      if (openJob !== id) return;
      pending = commands.some((c) => c.status === "queued");
      $("dlg-cmds").innerHTML = commands.slice().reverse().map(commandLine).join("");
      lockButtons();
    } catch (e) { /* the next refresh tries again */ }
  }

  async function send(job, picked) {
    if (sending || pending) return;
    const auto = picked === "approve-auto";
    const command = auto ? "approve" : picked;
    let text = ($("act-text") || {}).value || "";
    if (command === "answer") {
      const picked = document.querySelector('#dlg-acts input[name="answer"]:checked');
      if (picked && picked.value) text = picked.value;
      if (!text.trim()) { $("act-status").textContent = "Pick an option or write your answer."; return; }
    }
    if (command === "rework" && !text.trim()) { $("act-status").textContent = "Rework needs a note."; return; }
    if (command === "cancel" && !confirm(`Cancel ${job.id}? This closes its PR and deletes its branch.`)) return;
    sending = true; lockButtons();
    $("act-status").textContent = `Sending ${command}…`;
    try {
      await api("/command", { method: "POST", headers: { "Content-Type": "application/json" },
                              body: JSON.stringify({ command, job: job.id, text, by: "dashboard", auto,
                                                     test_note: command === "approve" && $("act-note") ? $("act-note").value : undefined }) });
      $("act-status").textContent = "";
      given = openStage;
    } catch (e) { $("act-status").textContent = e.message; }
    sending = false;
    await loadCommands(job.id);
  }

  function fillHeader(job) {
    $("dlg-id").textContent = `${job.id} · ${job.stage}`;
    $("dlg-title").textContent = job.title || job.id;
    $("dlg-reason").textContent = job.decision ? "" : job.reason || "";
    $("dlg-story").innerHTML = story(job);
  }

  function fillFiles(job) {
    const files = job.files || [];
    openFiles = files.join("\n");
    const current = document.querySelector('#dlg-files button[aria-current="true"]');
    $("dlg-files").innerHTML = files.map((f) => `<button data-path="${esc(f)}">${esc(f)}</button>`).join("") || `<div class="empty">No files yet</div>`;
    $("dlg-files").querySelectorAll("button").forEach((b) => {
      b.setAttribute("aria-current", String(!!current && b.dataset.path === current.dataset.path));
      b.addEventListener("click", () => show(job, b.dataset.path));
    });
  }

  function fillActions(job) {
    openStage = decisionKey(job);
    $("dlg-acts").innerHTML = actions(job);
    $("dlg-acts").querySelectorAll("button[data-cmd]").forEach((b) => b.addEventListener("click", () => send(job, b.dataset.cmd)));
    const own = $("dlg-acts").querySelector('input[name="answer"][value=""]');
    if (own) $("act-text").addEventListener("input", () => { own.checked = true; });
    lockButtons();
  }

  function open(id) {
    const job = (board.jobs || []).find((j) => j.id === id); if (!job) return;
    openJob = id; pending = false; sending = false; given = null;
    fillHeader(job);
    $("dlg-doc").innerHTML = "";
    $("dlg-cmds").innerHTML = "";
    fillFiles(job);
    fillActions(job);
    const files = job.files || [];
    const asked = job.decision && job.decision.kind === "question" && job.next
      ? `round-${job.next.round}/ruling-${job.next.attempt}.md` : null;
    const first = [asked, "decision.md", "spec.md"].find((f) => f && files.includes(f)) || files[0];
    if (first) show(job, first);
    if (!$("dlg").open) $("dlg").showModal();
    loadCommands(id);
  }

  // The open dialog follows the board: header always, files and actions only when they changed, so a
  // half-written rework note survives every refresh that doesn't move the job.
  function followOpen() {
    const job = (board.jobs || []).find((j) => j.id === openJob); if (!job) return;
    fillHeader(job);
    if ((job.files || []).join("\n") !== openFiles) fillFiles(job);
    if (decisionKey(job) !== openStage) fillActions(job);
    loadCommands(job.id);
  }

  $("title").innerHTML = T("FACTORY QUEST", "#ffd75e", 3, "#5b2a12") + T("AT THE TAVERN", "#f0c98a", 1, "#3a1a08");
  Sky.start($("sky"), still);
  $("dlg-close").addEventListener("click", () => $("dlg").close());
  $("dlg").addEventListener("close", () => { openJob = null; });

  async function refresh() {
    try {
      board = await (await api("/board.json")).json();
      render();
      if (openJob) followOpen();
    } catch (e) {
      $("meta").innerHTML = `<span class="error">${esc(e.message)}</span>`;
    }
  }
  if (!token) { $("meta").innerHTML = `<span class="error">Open the URL the server printed; it carries the token.</span>`; return; }
  Party.ready.then(refresh);
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
