<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory board</title>
<style>
  :root {
    --bg: #f6f6f4; --surface: #ffffff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e3e2dd;
    --accent: #2f5fd0; --pass: #1f7a4d; --pass-bg: #e3f3ea; --changes: #a33b1f; --changes-bg: #fbe7e1;
    --pending: #8a8a83; --pending-bg: #efefeb; --human: #b45309; --human-bg: #fff4e5;
    --radius: 10px; --shadow: 0 1px 2px rgb(0 0 0 / .06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --surface: #1d1d1b; --ink: #ecebe6; --muted: #9b9a93; --line: #2f2f2c;
      --accent: #7ea2ff; --pass: #6fd3a0; --pass-bg: #173326; --changes: #ff9a7a; --changes-bg: #3a1d15;
      --pending: #8f8e87; --pending-bg: #262624; --human: #ffb45c; --human-bg: #3a2810;
      --shadow: none; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; padding: 16px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12.5px; }
  .stopping { color: var(--human); font-weight: 600; }
  main { padding: 0 16px 32px; }
  .group { margin-bottom: 20px; }
  .group h2, .group summary { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
                              margin: 0 0 8px; font-weight: 600; }
  .group summary { cursor: pointer; }
  .card { width: 100%; text-align: left; background: var(--surface); color: inherit; border: 1px solid var(--line);
          border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; margin: 0 0 8px;
          cursor: pointer; font: inherit; display: block; }
  .card:hover { border-color: var(--accent); }
  .card.human { border-color: var(--human); }
  .card.compact { padding: 8px 14px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
  .card .head { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
  .card .id { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card .title { font: inherit; font-weight: 600; overflow-wrap: anywhere; color: inherit; background: none; border: 0;
                 padding: 0; text-align: left; cursor: pointer; }
  .card .title:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .card .reason { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; margin-top: 8px; }
  .card.human .reason { color: var(--human); }
  .card .waits { font-size: 12px; color: var(--human); overflow-wrap: anywhere; }
  .pipe { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  @media (max-width: 640px) { .pipe { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 10px; } }
  .step { min-width: 0; font-size: 12px; }
  .step .bar { display: block; height: 6px; border-radius: 3px; background: var(--line); margin-bottom: 5px; }
  .step .label { display: block; font-weight: 600; color: var(--muted); }
  .step .detail { display: block; font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
  .step.done .bar { background: var(--pass); }
  .step.active .bar { background: var(--accent); }
  .step.active .label { color: var(--accent); }
  .step.waiting .bar { background: var(--human); }
  .step.waiting .label, .step.waiting .detail { color: var(--human); }
  .step.blocked .bar { background: var(--changes); }
  .step.blocked .label { color: var(--changes); }
  .step.skipped .bar { background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 10px); }
  .step.pending .label { font-weight: 400; }
  .revs { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
  .chip { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--pending-bg); color: var(--pending);
          white-space: nowrap; }
  .chip.PASS { background: var(--pass-bg); color: var(--pass); }
  .chip.CHANGES { background: var(--changes-bg); color: var(--changes); }
  .chip.running { background: var(--accent); color: var(--surface); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }
  @media (prefers-reduced-motion: no-preference) {
    .step.active .bar { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .45; } }
  }
  dialog { width: min(880px, calc(100vw - 32px)); max-height: calc(100vh - 48px); border: 1px solid var(--line);
           border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink); }
  dialog::backdrop { background: rgb(0 0 0 / .35); }
  .dlg-head { display: flex; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .dlg-head h2 { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
  .dlg-body { display: grid; grid-template-columns: 180px 1fr; min-height: 300px; }
  @media (max-width: 640px) { .dlg-body { grid-template-columns: 1fr; } }
  .files { border-right: 1px solid var(--line); padding: 8px; overflow: auto; max-height: 65vh; }
  .files button { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit;
                  font: inherit; font-size: 12.5px; padding: 4px 6px; border-radius: 6px; cursor: pointer; overflow-wrap: anywhere; }
  .files button[aria-current="true"] { background: var(--pending-bg); font-weight: 600; }
  .doc { padding: 12px 18px; overflow: auto; max-height: 65vh; min-width: 0; }
  .doc pre { background: var(--pending-bg); padding: 10px; border-radius: 8px; overflow: auto; }
  .doc code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .doc table { border-collapse: collapse; } .doc td, .doc th { border: 1px solid var(--line); padding: 3px 8px; }
  .story-wrap:empty { display: none; }
  .story { margin: 0; padding: 10px 16px 10px 34px; border-bottom: 1px solid var(--line); font-size: 12.5px;
           color: var(--muted); display: grid; gap: 2px; }
  .story li { overflow-wrap: anywhere; }
  .acts { padding: 12px 16px; border-bottom: 1px solid var(--line); max-height: 55vh; overflow: auto; }
  .acts:empty { display: none; }
  .acts h3 { margin: 0 0 6px; font-size: 14px; }
  .acts .q { margin: 0 0 6px; font-weight: 600; overflow-wrap: anywhere; }
  .acts .ctx { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .acts .ctx p { margin: 0 0 6px; }
  .acts .lead { margin: 10px 0 4px; font-weight: 600; font-size: 13px; }
  .acts .least { margin: 0; padding-left: 20px; font-size: 13px; display: grid; gap: 4px; }
  .acts .warn { color: var(--changes); }
  .opts { border: 0; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
  .opt { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line);
         border-radius: 8px; cursor: pointer; overflow-wrap: anywhere; }
  .opt:has(input:checked) { border-color: var(--accent); }
  .opt input { margin-top: 3px; }
  .rec { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--pass-bg); color: var(--pass); }
  .acts textarea { display: block; width: 100%; min-height: 38px; margin-top: 8px; font: inherit; padding: 6px 8px;
                   border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: inherit; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .btn { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg);
         color: inherit; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--changes); }
  .btn:focus-visible, .files button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .cmds { display: grid; gap: 4px; padding: 8px 16px; font-size: 12.5px; border-bottom: 1px solid var(--line); }
  .cmds:empty { display: none; }
  .cmd { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; overflow-wrap: anywhere; }
  .cmd .state { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
  .cmd .state.queued { background: var(--pending-bg); color: var(--ink); }
  .cmd .state.applied { background: var(--pass-bg); color: var(--pass); }
  .cmd .state.refused { background: var(--changes-bg); color: var(--changes); }
  .note { font-size: 12.5px; color: var(--muted); }
  .error { color: var(--changes); padding: 16px; }
  @media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } }
</style>
</head>
<body>
<header>
  <h1>Factory board</h1>
  <span class="meta" id="meta">Loading…</span>
</header>
<main>
  <div id="groups"></div>
</main>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-head">
    <div><div class="note" id="dlg-id"></div><h2 id="dlg-title"></h2><div class="note" id="dlg-reason"></div></div>
    <button class="btn" id="dlg-close" aria-label="Close">Close</button>
  </div>
  <section class="story-wrap" id="dlg-story" aria-label="What has happened"></section>
  <section class="acts" id="dlg-acts"></section>
  <div class="cmds" id="dlg-cmds" role="status" aria-live="polite" aria-label="Commands for this job"></div>
  <div class="dlg-body">
    <nav class="files" id="dlg-files" aria-label="Job files"></nav>
    <article class="doc" id="dlg-doc"></article>
  </div>
</dialog>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  let token = params.get("token");
  try {
    if (token) { sessionStorage.setItem("factory-token", token); history.replaceState(null, "", "/"); }
    else token = sessionStorage.getItem("factory-token");
  } catch (e) { /* storage unavailable: keep the token in memory only */ }

  const GROUPS = [
    ["Needs you", ["needs-human"]], ["Working", ["starting", "building", "reviewing", "rebasing", "merging"]],
    ["Waiting for merge", ["pr-open"]], ["Queued", ["queued"]],
  ];
  const FINISHED = ["merged", "done", "cancelled", "unknown"];
  const STATUS_TEXT = { done: "done", active: "in progress", waiting: "waiting", blocked: "stopped",
                        skipped: "skipped", pending: "not started" };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let board = { jobs: [] }, openJob = null, openStage = null, openFiles = "", sending = false, pending = false;

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { "X-Factory-Token": token || "", ...(opts.headers || {}) } });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    return res;
  }

  function ago(iso) {
    const min = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    return min < 60 ? `${min} min` : `${Math.floor(min / 60)} h ${min % 60} min`;
  }

  function step(st) {
    const detail = [st.detail, st.since ? ago(st.since) : ""].filter(Boolean).join(" · ");
    const revs = (st.reviewers || []).map((r) =>
      `<span class="chip ${esc(r.status)}" title="${esc(r.name)}: ${esc(r.status)}">${esc(r.name)}`
      + `${r.status === "running" && r.since ? ` · ${esc(ago(r.since))}` : ""}</span>`).join("");
    const current = ["active", "waiting", "blocked"].includes(st.status);
    return `<li class="step ${esc(st.status)}"${current ? ` aria-current="step"` : ""}><span class="bar"></span>`
      + `<span class="label">${esc(st.label)}<span class="sr"> — ${esc(STATUS_TEXT[st.status] || st.status)}</span></span>`
      + (detail ? `<span class="detail">${esc(detail)}</span>` : "")
      + (revs ? `<span class="revs">${revs}</span>` : "") + `</li>`;
  }

  // A card is an article with one button, the title, that opens the job; a click anywhere on the card
  // does the same. A button may hold only text, so the pipeline sits beside it, not inside it.
  function card(job) {
    const human = job.stage === "needs-human";
    return `<article class="card ${human ? "human" : ""}" data-id="${esc(job.id)}">
      <div class="head"><button class="title" data-open="${esc(job.id)}">${esc(job.title || job.id)}</button>
        <span class="id">${esc(job.id)}${job.round ? ` · round ${esc(job.round)}` : ""}</span></div>
      <ol class="pipe" aria-label="Progress">${(job.pipeline || []).map(step).join("")}</ol>
      ${job.reason ? `<div class="reason">${esc(job.reason)}</div>` : ""}</article>`;
  }

  function compact(job) {
    return `<article class="card compact" data-id="${esc(job.id)}"><button class="title" data-open="${esc(job.id)}">`
      + `${esc(job.title || job.id)}</button><span class="id">${esc(job.id)} · ${esc(job.stage)}</span>`
      + ((job.waits_for || []).length ? `<span class="waits">waits for ${esc(job.waits_for.join(", "))}</span>` : "")
      + `</article>`;
  }

  function render() {
    const jobs = board.jobs || [];
    const finished = jobs.filter((j) => FINISHED.includes(j.stage));
    const finishedOpen = !!document.querySelector("details.group[open]");
    $("groups").innerHTML = GROUPS.map(([label, stages]) => {
      const items = jobs.filter((j) => stages.includes(j.stage));
      if (!items.length) return "";
      const draw = stages.includes("queued") ? compact : card;
      return `<section class="group"><h2>${label} · ${items.length}</h2>${items.map(draw).join("")}</section>`;
    }).join("")
      + (finished.length ? `<details class="group"${finishedOpen ? " open" : ""}><summary>Finished · ${finished.length}</summary>${finished.map(compact).join("")}</details>` : "")
      + (jobs.length ? "" : `<div class="empty">No jobs yet. Queue one with /factory add.</div>`);
    const when = board.updated_at ? new Date(board.updated_at).toLocaleTimeString() : "never";
    $("meta").innerHTML = `${esc(board.target || "")} · ${esc(board.merge_mode || "")} · updated ${esc(when)}`
      + (board.stopping ? ` · <span class="stopping">stopping after the current job</span>` : "")
      + (board.orchestrator === false ? ` · <span class="stopping">orchestrator not running — commands wait for /factory run</span>` : "")
      + (board.note ? ` · ${esc(board.note)}` : "");
    document.querySelectorAll(".card").forEach((el) => el.addEventListener("click", () => open(el.dataset.id)));
  }

  function markdown(src) {
    const lines = esc(src).split("\n"); const out = []; let list = false, code = false, table = false;
    const inline = (s) => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    const close = () => { if (list) { out.push("</ul>"); list = false; } if (table) { out.push("</table>"); table = false; } };
    for (const line of lines) {
      if (line.startsWith("```")) { close(); out.push(code ? "</code></pre>" : "<pre><code>"); code = !code; continue; }
      if (code) { out.push(line); continue; }
      const h = line.match(/^(#{1,4})\s+(.*)$/);
      if (h) { close(); out.push(`<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`); continue; }
      if (/^\s*[-*]\s+/.test(line) || /^\s*\d+\.\s+/.test(line)) {
        if (!list) { close(); out.push("<ul>"); list = true; }
        out.push(`<li>${inline(line.replace(/^\s*([-*]|\d+\.)\s+/, ""))}</li>`); continue;
      }
      if (/^\|.*\|$/.test(line.trim())) {
        if (/^\|[\s|:-]+\|$/.test(line.trim())) continue;
        if (!table) { close(); out.push("<table>"); table = true; }
        out.push(`<tr>${line.trim().slice(1, -1).split("|").map((c) => `<td>${inline(c.trim())}</td>`).join("")}</tr>`); continue;
      }
      close();
      out.push(line.trim() ? `<p>${inline(line)}</p>` : "");
    }
    close(); if (code) out.push("</code></pre>");
    return out.join("\n");
  }

  async function show(job, path) {
    document.querySelectorAll("#dlg-files button").forEach((b) => b.setAttribute("aria-current", String(b.dataset.path === path)));
    try {
      const text = await (await api(`/file?job=${encodeURIComponent(job.id)}&path=${encodeURIComponent(path)}`)).text();
      $("dlg-doc").innerHTML = markdown(text);
    } catch (e) { $("dlg-doc").innerHTML = `<p class="error">${esc(e.message)}</p>`; }
  }

  function story(job) {
    const lines = job.story || [];
    return lines.length ? `<ol class="story">${lines.map((l) => `<li>${esc(l)}</li>`).join("")}</ol>` : "";
  }

  function checksLine(c) {
    if (!c) return "";
    const over = c.diff_lines > c.max_diff ? ` <strong class="warn">over max_diff ${esc(c.max_diff)}</strong>` : "";
    return `<p class="note">${esc(c.diff_lines)} lines changed in ${esc(c.files)} files${over}`
      + `${(c.lockfiles || []).length ? ` · lockfiles: ${esc(c.lockfiles.join(", "))}` : ""}</p>`;
  }

  // What the developer decides now, and only the buttons that answer it.
  function decision(job) {
    const d = job.decision;
    const cancel = ["done", "merged", "cancelled"].includes(job.stage) ? [] : [["cancel", "Cancel job", "danger"]];
    if (d && d.kind === "question") {
      const options = (d.options || []).map((o, i) =>
        `<label class="opt"><input type="radio" name="answer" value="(${esc(o.key)}) ${esc(o.text)}"${o.recommended || (!i && !d.options.some((x) => x.recommended)) ? " checked" : ""}>`
        + `<span><strong>(${esc(o.key)})</strong> ${esc(o.text)}${o.recommended ? ` <span class="rec">recommended</span>` : ""}</span></label>`).join("");
      return { html: `<h3>Your decision</h3>${d.question ? `<p class="q">${esc(d.question)}</p>` : ""}`
        + `<div class="ctx">${markdown(d.context || "")}</div>`
        + `<fieldset class="opts"><legend class="sr">Options</legend>${options}`
        + `<label class="opt"><input type="radio" name="answer" value=""${options ? "" : " checked"}><span>Your own answer</span></label>`
        + `<textarea id="act-text" aria-label="Your own answer" placeholder="Your own answer"></textarea></fieldset>`,
        acts: [["answer", "Answer and continue", "primary"], ...cancel] };
    }
    if (d && d.kind === "approve") {
      const least = (d.least_sure || []).map((l) => `<li>${markdown(l).replace(/^<p>|<\/p>$/g, "")}</li>`).join("");
      return { html: `<h3>Ready for your approval</h3>${d.summary ? `<div class="ctx">${markdown(d.summary)}</div>` : ""}`
        + checksLine(d.checks)
        + (least ? `<p class="lead">Check before you approve — the reviewer is least sure of:</p><ol class="least">${least}</ol>`
                 : `<p class="note">The reviewer named nothing it is unsure of.</p>`)
        + `<textarea id="act-text" aria-label="Rework note" placeholder="Rework note — what to change"></textarea>`,
        acts: [["approve", "Approve", "primary"], ["rework", "Rework", ""], ...cancel] };
    }
    if (d && d.kind === "stopped") {
      return { html: `<h3>Stopped — needs you</h3><p class="q">${esc(d.reason)}</p>`
        + `<textarea id="act-text" aria-label="Rework note" placeholder="Rework note — what to do next"></textarea>`,
        acts: [["rework", "Rework", "primary"], ...cancel] };
    }
    const rework = job.stage === "pr-open" ? [["rework", "Rework", ""]] : [];
    if (!rework.length && !cancel.length) return { html: "", acts: [] };
    return { html: `<textarea id="act-text" aria-label="Rework note or reason for cancelling" placeholder="Rework note, or reason for cancelling"></textarea>`,
             acts: [...rework, ...cancel] };
  }

  function actions(job) {
    const { html, acts } = decision(job);
    return html + (acts.length ? `<div class="btns">${acts.map(([cmd, label, cls]) =>
      `<button class="btn ${cls}" data-cmd="${cmd}">${label}</button>`).join("")}<span class="note" id="act-status" role="status"></span></div>` : "");
  }

  function decisionKey(job) {
    const d = job.decision || {};
    return [job.stage, d.kind, d.question, d.context].join("|");
  }

  function lockButtons() {
    document.querySelectorAll("#dlg-acts button[data-cmd]").forEach((b) => { b.disabled = sending || pending; });
  }

  const STATE_TEXT = { queued: "Queued", applied: "Applied", refused: "Refused" };
  function commandLine(c) {
    const when = new Date(c.done_at || c.at).toLocaleTimeString();
    const detail = c.status === "queued" ? "waiting for the orchestrator" : c.outcome || "";
    return `<div class="cmd"><span class="state ${esc(c.status)}">${esc(STATE_TEXT[c.status] || c.status)}</span>`
      + `<span>${esc(c.command)} · ${esc(when)}${detail ? ` — ${esc(detail)}` : ""}</span></div>`;
  }

  async function loadCommands(id) {
    try {
      const { commands } = await (await api(`/commands?job=${encodeURIComponent(id)}`)).json();
      if (openJob !== id) return;
      pending = commands.some((c) => c.status === "queued");
      $("dlg-cmds").innerHTML = commands.slice().reverse().map(commandLine).join("");
      lockButtons();
    } catch (e) { /* the next refresh tries again */ }
  }

  async function send(job, command) {
    if (sending || pending) return;
    let text = ($("act-text") || {}).value || "";
    if (command === "answer") {
      const picked = document.querySelector('#dlg-acts input[name="answer"]:checked');
      if (picked && picked.value) text = picked.value;
      if (!text.trim()) { $("act-status").textContent = "Pick an option or write your answer."; return; }
    }
    if (command === "rework" && !text.trim()) { $("act-status").textContent = "Rework needs a note."; return; }
    if (command === "cancel" && !confirm(`Cancel ${job.id}? This closes its PR and deletes its branch.`)) return;
    sending = true; lockButtons();
    $("act-status").textContent = `Sending ${command}…`;
    try {
      await api("/command", { method: "POST", headers: { "Content-Type": "application/json" },
                              body: JSON.stringify({ command, job: job.id, text, by: "dashboard" }) });
      $("act-status").textContent = "";
      pending = true;
    } catch (e) { $("act-status").textContent = e.message; }
    sending = false;
    await loadCommands(job.id);
  }

  function fillHeader(job) {
    $("dlg-id").textContent = `${job.id} · ${job.stage}`;
    $("dlg-title").textContent = job.title || job.id;
    $("dlg-reason").textContent = job.decision ? "" : job.reason || "";
    $("dlg-story").innerHTML = story(job);
  }

  function fillFiles(job) {
    const files = job.files || [];
    openFiles = files.join("\n");
    const current = document.querySelector('#dlg-files button[aria-current="true"]');
    $("dlg-files").innerHTML = files.map((f) => `<button data-path="${esc(f)}">${esc(f)}</button>`).join("") || `<div class="empty">No files yet</div>`;
    $("dlg-files").querySelectorAll("button").forEach((b) => {
      b.setAttribute("aria-current", String(!!current && b.dataset.path === current.dataset.path));
      b.addEventListener("click", () => show(job, b.dataset.path));
    });
  }

  function fillActions(job) {
    openStage = decisionKey(job);
    $("dlg-acts").innerHTML = actions(job);
    $("dlg-acts").querySelectorAll("button[data-cmd]").forEach((b) => b.addEventListener("click", () => send(job, b.dataset.cmd)));
    const own = $("dlg-acts").querySelector('input[name="answer"][value=""]');
    if (own) $("act-text").addEventListener("input", () => { own.checked = true; });
    lockButtons();
  }

  function open(id) {
    const job = (board.jobs || []).find((j) => j.id === id); if (!job) return;
    openJob = id; pending = false; sending = false;
    fillHeader(job);
    $("dlg-doc").innerHTML = "";
    $("dlg-cmds").innerHTML = "";
    fillFiles(job);
    fillActions(job);
    const files = job.files || [];
    const asked = job.decision && job.decision.kind === "question" && job.next
      ? `round-${job.next.round}/ruling-${job.next.attempt}.md` : null;
    const first = [asked, "decision.md", "spec.md"].find((f) => f && files.includes(f)) || files[0];
    if (first) show(job, first);
    if (!$("dlg").open) $("dlg").showModal();
    loadCommands(id);
  }

  // The open dialog follows the board: header always, files and actions only when they changed, so a
  // half-written rework note survives every refresh that doesn't move the job.
  function followOpen() {
    const job = (board.jobs || []).find((j) => j.id === openJob); if (!job) return;
    fillHeader(job);
    if ((job.files || []).join("\n") !== openFiles) fillFiles(job);
    if (decisionKey(job) !== openStage) fillActions(job);
    loadCommands(job.id);
  }

  $("dlg-close").addEventListener("click", () => $("dlg").close());
  $("dlg").addEventListener("close", () => { openJob = null; });

  async function refresh() {
    try {
      board = await (await api("/board.json")).json();
      render();
      if (openJob) followOpen();
    } catch (e) {
      $("meta").innerHTML = `<span class="error">${esc(e.message)}</span>`;
    }
  }
  if (!token) { $("meta").innerHTML = `<span class="error">Open the URL the server printed; it carries the token.</span>`; return; }
  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
